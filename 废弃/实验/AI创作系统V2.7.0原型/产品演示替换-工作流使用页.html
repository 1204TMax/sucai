<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>产品演示替换</title>
  <style>
    :root{
      --primary-1:#e8f4ff;--primary-2:#c4e2ff;--primary-5:#5aa4ff;--primary-6:#4a9eff;--primary-7:#3580db;
      --gray-1:#fcfcfd;--gray-2:#f8f9fa;--gray-3:#f1f3f5;--gray-4:#e9ecef;--gray-6:#ced4da;--gray-8:#868e96;--gray-9:#6c757d;--gray-11:#495057;--gray-12:#212529;
      --bg-page:var(--gray-2);--bg-surface:var(--gray-1);--bg-subtle:var(--gray-3);--bg-hover:var(--gray-4);--border-1:var(--gray-4);--border-2:var(--gray-6);
      --text-hi:var(--gray-12);--text-lo:var(--gray-11);--text-muted:var(--gray-9);--text-ghost:var(--gray-8);--accent-bg:var(--primary-1);--accent-border:var(--primary-2);--accent-solid:var(--primary-6);--accent-text:var(--primary-7);
      --success:#34c759;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;--text-xs:11px;--text-sm:12px;--text-base:13px;--text-md:14px;--text-lg:16px;
      --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-7:32px;--h-sm:28px;--h-md:32px;--r-sm:4px;--r-md:6px;--r-lg:8px;--r-xl:12px;--r-full:9999px;--ease:140ms ease;
    }
    *{box-sizing:border-box} body{min-height:100vh;margin:0;background:var(--bg-page);color:var(--text-hi);font:var(--text-md)/1.5 var(--font)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent-solid);outline-offset:2px}
    .page{width:min(1400px,calc(100% - 48px));margin:0 auto;padding:24px 0 40px}.page-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-5);min-height:36px}.head-left{display:flex;min-width:0;align-items:center;gap:var(--space-3)}.back{padding:0;border:0;background:transparent;color:var(--text-muted);font-size:var(--text-sm)}.back:hover{color:var(--accent-solid)}.head-divider{width:1px;height:18px;background:var(--border-1)}.task-name{overflow:hidden;color:var(--text-hi);font-size:var(--text-lg);font-weight:600;text-overflow:ellipsis;white-space:nowrap}.task-id,.page-status{color:var(--text-muted);font-size:var(--text-sm);white-space:nowrap}.page-status{display:inline-flex;align-items:center;gap:8px}.page-status::before{width:8px;height:8px;border-radius:50%;background:var(--accent-solid);box-shadow:0 0 0 4px var(--accent-bg);content:""}
    .flow-context{display:flex;align-items:center;gap:var(--space-3);margin-top:16px;padding:12px var(--space-4);border:1px solid var(--border-1);border-radius:var(--r-lg);background:var(--bg-surface)}.flow-step{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);font-size:var(--text-sm);white-space:nowrap}.flow-step::before{width:7px;height:7px;border:2px solid var(--border-2);border-radius:50%;content:""}.flow-step.done{color:var(--text-lo)}.flow-step.done::before{border-color:var(--accent-solid);background:var(--accent-solid)}.flow-step.current{color:var(--accent-text);font-weight:600}.flow-step.current::before{width:10px;height:10px;border:3px solid var(--accent-solid);background:var(--bg-surface);box-shadow:0 0 0 3px var(--accent-bg)}.flow-line{width:32px;height:1px;background:var(--border-2)}.flow-tip{margin-left:auto;color:var(--text-muted);font-size:var(--text-sm)}
    .discovery-card{overflow:hidden;margin-top:16px;border:1px solid var(--border-1);border-radius:var(--r-xl);background:var(--bg-surface);box-shadow:0 1px 4px rgba(0,0,0,.05)}.discovery-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-5);padding:20px var(--space-6) 16px}.discovery-copy{display:flex;flex-direction:column;gap:4px}.eyebrow{color:var(--accent-text);font-size:var(--text-xs);font-weight:600}.discovery-copy h1{margin:0;color:var(--text-hi);font-size:20px;line-height:1.35}.discovery-copy p{margin:0;color:var(--text-muted);font-size:var(--text-base)}.rule{color:var(--text-muted);font-size:var(--text-sm);white-space:nowrap}.rule strong{color:var(--text-lo);font-weight:500}
    .evidence-grid{border-top:1px solid var(--border-1)}.original-panel{padding:var(--space-5) var(--space-6)}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-3)}.panel-head strong{font-size:var(--text-md)}.panel-head span{color:var(--text-muted);font-size:var(--text-sm)}.original-video{display:block;width:100%;max-height:300px;border-radius:var(--r-lg);background:#263241}.original-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;color:var(--text-muted);font-size:var(--text-xs)}.original-current{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--text-muted);font-size:var(--text-xs)}.original-current strong{color:var(--text-lo);font-size:var(--text-sm)}.marker-line{display:flex;gap:8px;margin-top:8px}.marker{position:relative;display:flex;min-width:0;flex:1;flex-direction:column;align-items:flex-start;justify-content:center;height:48px;padding:6px 10px;border:1px solid var(--border-1);border-radius:var(--r-md);background:var(--bg-subtle);color:var(--text-muted);text-align:left}.marker strong{font-size:var(--text-sm)}.marker span{font-size:var(--text-xs)}.marker em{position:absolute;right:10px;font-size:var(--text-xs);font-style:normal}.marker:hover{border-color:var(--accent-border);color:var(--accent-solid)}.marker.active{border-color:var(--accent-border);background:var(--accent-bg);color:var(--accent-text);font-weight:600}.marker.ready em{color:var(--success)}.marker.selected em{color:var(--accent-solid)}
    .config-body{padding:20px var(--space-6) var(--space-6);border-top:1px solid var(--border-1)}.config-body .replacement-choice{margin-top:0}
    .replacement-choice{margin-top:20px}.replacement-choice-head{display:flex;align-items:baseline;gap:8px}.replacement-choice-head strong{font-size:var(--text-md)}.replacement-choice-head span{color:var(--text-muted);font-size:var(--text-sm)}.replace-actions{display:flex;align-items:center;gap:10px;margin-top:12px}.replace-primary,.replace-secondary,.replace-resource{display:inline-flex;align-items:center;justify-content:center;height:var(--h-md);padding:0 var(--space-4);border-radius:var(--r-md);font-size:var(--text-sm);font-weight:500;white-space:nowrap}.replace-primary{border:1px solid var(--accent-solid);background:var(--accent-solid);color:#fff}.replace-primary:hover{border-color:var(--primary-7);background:var(--primary-7)}.replace-secondary{border:1px solid var(--border-2);background:var(--bg-surface);color:var(--text-lo)}.replace-secondary:hover{border-color:var(--accent-solid);color:var(--accent-solid)}.replace-resource{padding:0;border:0;background:transparent;color:var(--text-muted)}.replace-resource:hover{color:var(--accent-solid)}.selected-replacement{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);margin-top:12px;padding:10px 12px;border:1px solid var(--accent-border);border-radius:var(--r-lg);background:var(--accent-bg)}.selected-replacement[hidden]{display:none}.selected-replacement-main{display:flex;min-width:0;align-items:center;gap:10px}.selected-replacement-badge{display:flex;align-items:center;justify-content:center;width:28px;height:28px;flex:none;border-radius:var(--r-md);background:var(--accent-solid);color:#fff;font-size:11px}.selected-replacement-copy{min-width:0}.selected-replacement-copy strong,.selected-replacement-copy span{overflow:hidden;display:block;text-overflow:ellipsis;white-space:nowrap}.selected-replacement-copy strong{color:var(--text-lo);font-size:var(--text-sm)}.selected-replacement-copy span{color:var(--text-muted);font-size:var(--text-xs)}.selected-replacement-actions{display:flex;align-items:center;gap:12px;flex:none}.candidate-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}.candidate{display:grid;grid-template-columns:18px 44px minmax(0,1fr) auto;align-items:center;gap:10px;min-width:0;padding:10px;border:1px solid var(--border-1);border-radius:var(--r-lg);background:var(--bg-surface);transition:var(--ease)}.candidate:hover{border-color:var(--accent-border);background:var(--accent-bg)}.candidate.selected{border-color:var(--accent-solid);background:var(--accent-bg)}.candidate input{width:16px;height:16px;margin:0;accent-color:var(--accent-solid)}.candidate-thumb{display:flex;align-items:center;justify-content:center;width:44px;height:36px;border-radius:var(--r-md);background:#34475d;color:#fff;font-size:11px}.candidate-copy{min-width:0}.candidate-copy strong,.candidate-copy span{overflow:hidden;display:block;text-overflow:ellipsis;white-space:nowrap}.candidate-copy strong{color:var(--text-lo);font-size:var(--text-base);font-weight:500}.candidate-copy span{margin-top:1px;color:var(--text-muted);font-size:var(--text-xs)}.candidate-preview{padding:0;border:0;background:transparent;color:var(--accent-solid);font-size:var(--text-sm)}
    .replace-primary.is-disabled,.replace-secondary:disabled,.replace-resource:disabled{pointer-events:none;opacity:.48}
    .btn{height:var(--h-md);padding:0 var(--space-4);border:1px solid var(--border-2);border-radius:var(--r-md);background:var(--bg-surface);color:var(--text-lo);font-size:var(--text-sm);font-weight:500}.btn:hover:not(:disabled){border-color:var(--accent-solid);color:var(--accent-solid)}.btn.primary{border-color:var(--accent-solid);background:var(--accent-solid);color:#fff}.btn.primary:hover:not(:disabled){background:var(--primary-7);border-color:var(--primary-7);color:#fff}.btn:disabled{border-color:var(--border-1);background:var(--bg-subtle);color:var(--text-ghost);cursor:not-allowed}
    .dialog-mask{position:fixed;z-index:10;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.45)}.dialog-mask.show{display:flex}.dialog{width:min(680px,100%);overflow:hidden;border-radius:var(--r-xl);background:var(--bg-surface);box-shadow:0 16px 48px rgba(0,0,0,.2)}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border-1)}.dialog-head strong{font-size:var(--text-lg)}.close{width:28px;height:28px;padding:0;border:0;border-radius:var(--r-md);background:transparent;color:var(--text-muted);font-size:20px}.close:hover{background:var(--bg-subtle);color:var(--text-hi)}.dialog-body{padding:20px}.dialog-body video{display:block;width:100%;max-height:400px;border-radius:var(--r-lg);background:#263241}.dialog-copy{margin:0;color:var(--text-lo);white-space:pre-line}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;z-index:20;right:24px;bottom:24px;display:none;max-width:340px;padding:10px 14px;border-radius:var(--r-md);background:var(--gray-12);box-shadow:0 8px 24px rgba(0,0,0,.18);color:#fff;font-size:var(--text-sm)}.toast.show{display:block}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
    .workspace-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(360px,.8fr);border-top:1px solid var(--border-1)}.workspace-grid .original-panel{border-right:1px solid var(--border-1)}.workspace-grid .config-body{padding:var(--space-6);border:0}.current-config-title{margin:0;color:var(--text-hi);font-size:var(--text-md)}.current-config-segment{display:block;margin-top:var(--space-5);color:var(--accent-solid);font-size:var(--text-md);font-weight:600}.current-config-copy{margin:var(--space-3) 0 0;color:var(--text-muted);font-size:var(--text-sm)}.workspace-grid .replacement-choice{margin-top:var(--space-6)}.workspace-grid .replacement-choice-head{display:none}.submit-bar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-5);padding:var(--space-4) var(--space-6);border-top:1px solid var(--border-1)}.submit-copy{display:flex;align-items:baseline;gap:var(--space-2);min-width:0}.submit-copy strong{color:var(--text-lo);font-size:var(--text-sm)}.submit-copy span{overflow:hidden;color:var(--text-muted);font-size:var(--text-sm);text-overflow:ellipsis;white-space:nowrap}.submit-bar .btn{min-width:184px}.candidate-preview:disabled{cursor:not-allowed;opacity:.48}
    @media(max-width:900px){.page{width:min(100% - 24px,1400px);padding-top:12px}.page-head{align-items:flex-start;flex-direction:column;gap:8px}.workspace-grid{grid-template-columns:1fr}.workspace-grid .original-panel{border-right:0;border-bottom:1px solid var(--border-1)}.submit-bar{align-items:flex-start;flex-direction:column}.submit-bar .btn{align-self:flex-end}.candidate-list{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="page" aria-label="产品演示替换">
    <header class="page-head"><div class="head-left"><button class="back" id="back" type="button">← 返回我的任务</button><span class="head-divider"></span><strong class="task-name">产品演示替换 2026/1/1-14/22</strong></div></header>

    <section class="discovery-card" aria-labelledby="discovery-title">
      <header class="discovery-head"><div class="discovery-copy"><span class="eyebrow">识别完成</span><h1 id="discovery-title">发现 2 个产品演示片段，请配置替换方案</h1></div><span class="rule"><strong id="discovery-count">0 / 2</strong> 已配置</span></header>
      <div class="workspace-grid">
        <article class="original-panel"><div class="panel-head"><strong>原视频与已识别片段</strong><span>点击下方片段，开始配置替换方案</span></div><video class="original-video" id="original-video" controls preload="metadata" playsinline></video><div class="original-current"><span>当前查看</span><strong id="original-selected-label">产品演示片段 1 · 00:18 – 00:33</strong></div><div class="marker-line" id="marker-list" aria-label="原视频中的已识别片段"></div></article>
        <aside class="config-body" aria-label="当前替换方案"><h2 class="current-config-title">当前替换方案</h2><strong class="current-config-segment" id="current-config-segment">产品演示片段 1 · 00:18 – 00:33</strong><p class="current-config-copy">请选择需要替换的产品演示录屏，确认后系统会自动合入画面手机屏幕中。</p><section class="replacement-choice" aria-label="选择替换素材"><div class="replace-actions"><label class="replace-primary" id="upload-label" for="video-upload">上传本地视频</label><button class="replace-secondary" id="open-task-assets" type="button">从已上传视频选择</button><button class="replace-secondary" id="open-system-assets" type="button">系统资源</button></div><div class="selected-replacement" id="selected-replacement" hidden></div><input class="sr-only" id="video-upload" type="file" accept="video/mp4,video/quicktime,video/webm"></section></aside>
      </div>
      <footer class="submit-bar"><div class="submit-copy"><strong id="submit-summary">已配置 1 / 2 个片段</strong><span>确认后将提交全部替换方案并继续执行任务。</span></div><button class="btn primary" id="submit-replacement" type="button">确认并提交全部替换方案</button></footer>
    </section>
  </main>

  <div class="dialog-mask" id="preview-dialog"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="dialog-head"><strong id="dialog-title">视频预览</strong><button class="close" id="close-preview" type="button" aria-label="关闭">×</button></header><div class="dialog-body"><video id="dialog-video" controls playsinline preload="metadata"></video><p class="dialog-copy" id="dialog-copy"></p><div class="dialog-foot"><button class="btn" id="dialog-confirm" type="button">关闭</button></div></div></section></div>
  <div class="dialog-mask" id="asset-dialog"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="asset-dialog-title"><header class="dialog-head"><strong id="asset-dialog-title">选择已上传视频</strong><button class="close" id="close-asset-dialog" type="button" aria-label="关闭">×</button></header><div class="dialog-body"><p class="dialog-copy" id="asset-dialog-copy"></p><fieldset class="candidate-list" id="asset-picker-list"><legend class="sr-only">选择替换视频</legend></fieldset><div class="dialog-foot"><button class="btn" id="asset-dialog-cancel" type="button">取消</button></div></div></section></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function(){
      var demoVideo='../../icon/步数1-1.mp4';
      var stateKey='ai-creation.product-demo-replacement.wf-product-demo-replacement.v4';
      var segments=[
        {time:'00:18 – 00:33',name:'产品演示片段 1',src:demoVideo+'#t=3,18',choice:null},
        {time:'01:05 – 01:21',name:'产品演示片段 2',src:demoVideo+'#t=21,37',choice:null}
      ];
      var assets=[
        {id:'task-a',source:'task',name:'产品演示_A.mp4',meta:'15 秒 · 18.7 MB',src:demoVideo+'#t=1,16'},
        {id:'task-b',source:'task',name:'产品演示_B.mp4',meta:'16 秒 · 21.3 MB',src:demoVideo+'#t=18,34'},
        {id:'local-demo',source:'local',name:'已上传视频.mp4',meta:'15 秒 · 18.7 MB',src:demoVideo+'#t=1,16'},
        {id:'system-c',source:'system',name:'厨房清洁演示_01.mp4',meta:'12 秒 · 系统资源',src:demoVideo+'#t=29,41'},
        {id:'system-d',source:'system',name:'产品使用演示_02.mp4',meta:'15 秒 · 系统资源',src:demoVideo+'#t=1,16'}
      ];
      segments[0].choice=assets.find(function(asset){return asset.id==='task-b'});
      var selected=0,assetDialogSource='',submitted=false,lastFocus=null,toastTimer=null;
      var $=function(id){return document.getElementById(id)};
      function current(){return segments[selected]}
      function done(){return segments.filter(function(item){return item.choice!==null}).length}
      function escapeHtml(value){return String(value).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
      function notify(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){$('toast').classList.remove('show')},2200)}
      function save(){try{localStorage.setItem(stateKey,JSON.stringify({submitted:submitted,choices:segments.map(function(item){return item.choice==='preserve'?'preserve':item.choice?item.choice.id:null})}))}catch(error){}}
      function restore(){try{var saved=JSON.parse(localStorage.getItem(stateKey)||'null');if(!saved||!Array.isArray(saved.choices))return;segments.forEach(function(segment,index){var id=saved.choices[index];segment.choice=id==='preserve'?'preserve':assets.find(function(asset){return asset.id===id})||null});submitted=saved.submitted===true}catch(error){}}
      function setDialog(id,opener){lastFocus=opener||document.activeElement;$(id).classList.add('show');setTimeout(function(){$(id).querySelector('button').focus()},0)}
      function closeDialog(id){$(id).classList.remove('show');if(lastFocus&&lastFocus.focus)lastFocus.focus()}
      function openPreview(title,src,copy,opener){$('dialog-title').textContent=title;$('dialog-video').src=src;$('dialog-copy').textContent=copy||'';setDialog('preview-dialog',opener)}
      function choiceLabel(segment){return !segment.choice?'未配置':segment.choice==='preserve'?'保留原片段':segment.choice.name}
      function renderMarkers(){
        $('marker-list').innerHTML=segments.map(function(segment,index){var state=!segment.choice?'待配置':'已配置';var cls=!segment.choice?'':segment.choice==='preserve'?' ready':' selected';return '<button class="marker'+(index===selected?' active':'')+cls+'" type="button" data-marker="'+index+'"><strong>'+escapeHtml(segment.name)+'</strong><span>'+segment.time+'</span><em>'+state+'</em></button>'}).join('');
        document.querySelectorAll('[data-marker]').forEach(function(button){button.addEventListener('click',function(){selected=Number(button.dataset.marker);render()})})
      }
      function sourceLabel(source){return source==='task'?'任务已上传视频':source==='system'?'系统资源':'本地上传视频'}
      function renderSelectedReplacement(){
        var holder=$('selected-replacement'),choice=current().choice,disabled=submitted?' disabled':'';
        if(!choice){holder.hidden=true;holder.innerHTML='';return}
        holder.hidden=false;
        if(choice==='preserve'){
          holder.innerHTML='<div class="selected-replacement-main"><span class="selected-replacement-badge">✓</span><span class="selected-replacement-copy"><strong>保留原片段</strong><span>不会替换 '+escapeHtml(current().name)+'</span></span></div><div class="selected-replacement-actions"><button class="candidate-preview" type="button" data-delete-choice'+disabled+'>取消保留</button></div>';
        }else{
          holder.innerHTML='<div class="selected-replacement-main"><span class="selected-replacement-badge">▶</span><span class="selected-replacement-copy"><strong>已上传视频：'+escapeHtml(choice.name)+'</strong><span>'+sourceLabel(choice.source)+' · '+escapeHtml(choice.meta)+'</span></span></div><div class="selected-replacement-actions"><button class="candidate-preview" type="button" data-selected-preview>预览</button><button class="candidate-preview" type="button" data-delete-choice'+disabled+'>删除</button></div>';
        }
        var preview=holder.querySelector('[data-selected-preview]');if(preview){preview.addEventListener('click',function(){openPreview(choice.name,choice.src,choice.meta,preview)})}
        var remove=holder.querySelector('[data-delete-choice]');if(remove){remove.addEventListener('click',function(){if(submitted)return;current().choice=null;save();render();notify('已删除替换视频，可重新添加')})}
      }
      function openAssetDialog(source,opener){
        if(submitted)return;assetDialogSource=source;var list=assets.filter(function(asset){return asset.source===source}),title=source==='task'?'选择已上传视频':'选择系统资源';
        $('asset-dialog-title').textContent=title;$('asset-dialog-copy').textContent=source==='task'?'这些视频是任务开始时已上传的，可直接用于替换当前片段。':'从系统资源中选择视频用于替换当前片段。';
        $('asset-picker-list').innerHTML=list.map(function(asset){var checked=current().choice&&current().choice.id===asset.id;return '<div class="candidate'+(checked?' selected':'')+'"><input id="asset-'+asset.id+'" type="radio" name="asset-picker" value="'+asset.id+'"'+(checked?' checked':'')+'><span class="candidate-thumb">▶</span><label class="candidate-copy" for="asset-'+asset.id+'"><strong>'+escapeHtml(asset.name)+'</strong><span>'+escapeHtml(asset.meta)+'</span></label><button class="candidate-preview" type="button" data-picker-preview="'+asset.id+'">预览</button></div>'}).join('');
        $('asset-picker-list').querySelectorAll('input[name="asset-picker"]').forEach(function(input){input.addEventListener('change',function(){var asset=assets.find(function(item){return item.id===input.value});if(!asset)return;current().choice=asset;save();closeDialog('asset-dialog');render();notify('已为当前片段选择替换视频')})});
        $('asset-picker-list').querySelectorAll('[data-picker-preview]').forEach(function(button){button.addEventListener('click',function(){var asset=assets.find(function(item){return item.id===button.dataset.pickerPreview});if(asset)openPreview(asset.name,asset.src,asset.meta,button)})});
        setDialog('asset-dialog',opener);
      }
      function render(){
        var count=done(),segment=current(),allDone=count===segments.length;$('original-video').src=demoVideo;$('original-selected-label').textContent=segment.name+' · '+segment.time;$('current-config-segment').textContent=segment.name+' · '+segment.time;$('discovery-count').textContent=count+' / '+segments.length;$('submit-summary').textContent=submitted?'全部替换方案已提交':'已配置 '+count+' / '+segments.length+' 个片段';$('video-upload').disabled=submitted;$('upload-label').classList.toggle('is-disabled',submitted);$('open-task-assets').disabled=submitted;$('open-system-assets').disabled=submitted;$('submit-replacement').disabled=submitted||!allDone;$('submit-replacement').textContent=submitted?'已提交':'确认并提交全部替换方案';renderMarkers();renderSelectedReplacement();
      }
      function submitReplacement(){
        if(submitted)return;
        if(done()!==segments.length){notify('请先完成所有产品演示片段的配置');return}
        submitted=true;save();render();notify('提交成功，正在返回我的任务');
        setTimeout(function(){try{if(window.parent!==window){window.parent.postMessage({action:'productDemoReplacementSubmitted',taskId:'wf-product-demo-replacement'},'*');window.parent.postMessage({action:'closeCurrentTab'},'*');return}}catch(error){}window.location.href='../../../AI 创作/我的任务.html#task-card-wf-product-demo-replacement'},1000);
      }
      $('back').addEventListener('click',function(){try{if(window.parent!==window){window.parent.postMessage({action:'closeCurrentTab'},'*');return}}catch(error){}window.location.href='../../../AI 创作/我的任务.html'});
      $('open-task-assets').addEventListener('click',function(){openAssetDialog('task',$('open-task-assets'))});$('open-system-assets').addEventListener('click',function(){openAssetDialog('system',$('open-system-assets'))});
      $('submit-replacement').addEventListener('click',submitReplacement);
      $('video-upload').addEventListener('change',function(event){var file=event.target.files&&event.target.files[0];if(!file)return;var valid=/^(video\/mp4|video\/quicktime|video\/webm)$/.test(file.type);if(!valid){notify('仅支持 MP4、MOV、WEBM 视频');event.target.value='';return}if(file.size>200*1024*1024){notify('视频需小于 200 MB');event.target.value='';return}var url=URL.createObjectURL(file),probe=document.createElement('video');probe.preload='metadata';probe.onloadedmetadata=function(){var asset={id:'local-'+Date.now(),source:'local',name:file.name,meta:Math.max(1,Math.round(probe.duration))+' 秒 · '+(file.size/1024/1024).toFixed(1)+' MB',src:url};assets.push(asset);current().choice=asset;save();event.target.value='';render();notify('已上传并选为当前片段的替换视频')};probe.onerror=function(){URL.revokeObjectURL(url);event.target.value='';notify('无法读取视频信息，请重新上传')};probe.src=url});
      $('close-preview').addEventListener('click',function(){closeDialog('preview-dialog')});$('dialog-confirm').addEventListener('click',function(){closeDialog('preview-dialog')});$('close-asset-dialog').addEventListener('click',function(){closeDialog('asset-dialog')});$('asset-dialog-cancel').addEventListener('click',function(){closeDialog('asset-dialog')});document.querySelectorAll('.dialog-mask').forEach(function(mask){mask.addEventListener('click',function(event){if(event.target===mask)closeDialog(mask.id)})});document.addEventListener('keydown',function(event){if(event.key==='Escape'){if($('preview-dialog').classList.contains('show'))closeDialog('preview-dialog');if($('asset-dialog').classList.contains('show'))closeDialog('asset-dialog')}});
      restore();render();
    }());
  </script>
