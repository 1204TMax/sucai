        const normalizeFileList = event => {

        const getRawFile = file => file.originFileObj || file;

        const getMediaType = file => {
            const rawFile = getRawFile(file);
            const type = (file.type || rawFile.type || '').toLowerCase();
            const name = (file.name || '').toLowerCase();

            if (type.startsWith('image/') || /\.(avif|bmp|gif|jpe?g|png|svg|webp)$/.test(name)) {
                return 'image';
            }

            if (type.startsWith('video/') || /\.(avi|m4v|mkv|mov|mp4|mpeg|ogg|webm)$/.test(name)) {
                return 'video';
            }

            return '';
        };

        const formatFiles = files => (files || []).map(file => ({
            name: file.name,
            size: file.size,
            type: file.type || getRawFile(file).type || '',
        }));

        const parseRatio = value => {
            const [width, height] = String(value || '').split(':').map(Number);
            return Number.isFinite(width) && Number.isFinite(height) && width > 0 && height > 0 ? { width, height } : null;
        };

        const getFileRatio = file => {
            const width = Number(file?.width || file?.videoWidth);
            const height = Number(file?.height || file?.videoHeight);
            if (width > 0 && height > 0) return { width, height };
            return { width: 16, height: 9 };
        };

        const formatRatioLabel = ratio => {
            if (!ratio) return '';
            const gcd = (a, b) => b ? gcd(b, a % b) : a;
            const divisor = gcd(Math.round(ratio.width), Math.round(ratio.height));
            return `${Math.round(ratio.width / divisor)}:${Math.round(ratio.height / divisor)}`;
        };

        const App = () => {

            const [resolutionPreset, setResolutionPreset] = useState(CUSTOM_RESOLUTION);
            const [preview, setPreview] = useState({ open: false, title: '', url: '', type: '' });
            const [reeditContext, setReeditContext] = useState(null);

            const [reusePreviousCutResult, setReusePreviousCutResult] = useState(true);
            const [reeditNoticeExpanded, setReeditNoticeExpanded] = useState(false);

            const [stickerSource, setStickerSource] = useState('official');

            const [generationMode, setGenerationMode] = useState('one_to_one');
            const [selectedVariationOptions, setSelectedVariationOptions] = useState([]);
            const [variationValues, setVariationValues] = useState({});

            const handlePaste = useCallback((e) => {
                const clipboardFiles = e.clipboardData?.files;
                if (!clipboardFiles || clipboardFiles.length === 0) return;

                const newImages = [];
                const newVideos = [];
                let skippedGifCount = 0;

                Array.from(clipboardFiles).forEach(file => {
                    const mediaType = getMediaType(file);
                    if (!mediaType) return;

                    if (mediaType === 'image' && (/\.gif$/i.test(file.name || '') || file.type === 'image/gif')) {
                        skippedGifCount += 1;
                        return;
                    }

                    const rcFile = {
                        uid: `rc-upload-paste-${Date.now()}-${Math.random().toString(36).slice(2)}`,
                        name: file.name,
                        type: file.type,
                        size: file.size,
                        originFileObj: file,
                        status: 'done'
                    };

                    if (mediaType === 'image') {
                        newImages.push(rcFile);
                    } else if (mediaType === 'video') {
                        newVideos.push(rcFile);
                    }
                });

                if (newImages.length === 0 && newVideos.length === 0) {
                    if (skippedGifCount > 0) message.warning('普通图像上传组件不支持 GIF，已忽略；如需使用请从贴纸入口添加。');
                    return;
                }

                e.preventDefault();

                if (newImages.length > 0) {
                    const combinedImages = [...imageFiles, ...newImages].slice(0, MAX_IMAGE_MATERIALS);
                    setImageFiles(combinedImages);
                    form.setFieldsValue({ imageMaterials: combinedImages });
                }

                if (newVideos.length > 0) {
                    const combinedVideos = [...videoFiles, ...newVideos];
                    setVideoFiles(combinedVideos);
                    if (!stickerTargetUid) setStickerTargetUid(combinedVideos[0]?.uid || '');
                    form.setFieldsValue({ videoMaterials: combinedVideos });
                }

                if (skippedGifCount > 0) message.warning('普通图像上传组件不支持 GIF，已忽略；如需使用请从贴纸入口添加。');

                message.success(`成功从剪贴板粘贴添加 ${newImages.length + newVideos.length} 个文件`);
            }, [imageFiles, videoFiles, stickerTargetUid, form]);

            useEffect(() => {
                document.addEventListener('paste', handlePaste);
                return () => {
                    document.removeEventListener('paste', handlePaste);
                };
            }, [handlePaste]);

            useEffect(() => {
                let data = null;
                try {
                    const raw = localStorage.getItem('pendingWorkflow');
                    if (raw) data = JSON.parse(raw);
                } catch (error) {}
                if (!data) return;
                const noticeKey = `workflow-reedit-notice-${data.taskId || 'current'}`;
                const canShowNotice = !sessionStorage.getItem(noticeKey);
                setReeditContext({ ...data, showNotice: canShowNotice });
                if (canShowNotice) sessionStorage.setItem(noticeKey, 'shown');
                const input = data.workflowInput || data.opts || {};
                const restoreFile = (item, index, mediaType) => ({
                    uid: `reedit-${data.taskId || 'task'}-${mediaType}-${index}`,
                    name: item.name || `${mediaType === 'video' ? '视频' : '图片'}素材${index + 1}`,
                    status: 'done',
                    type: item.mimeType || (mediaType === 'video' ? 'video/mp4' : 'image/png'),
                    url: item.url || item.thumb || '',

                const restoredImages = (input.imageMaterials || []).map((item, index) => restoreFile(item, index, 'image'));
                const restoredVideos = (input.videoMaterials || []).map((item, index) => restoreFile(item, index, 'video'));
                setImageFiles(restoredImages);
                setVideoFiles(restoredVideos);
                if (restoredVideos.length) setStickerTargetUid(input.stickerTargetUid || restoredVideos[0].uid);

                    ...item,
                    id: item.id || `restored-sticker-${index}`,
                    type: item.type || ((item.meta || '').includes('GIF') ? 'image/gif' : 'image/png'),
                }));
                const restoredPositions = {};
                restoredStickerItems.forEach((item, index) => {
                    restoredPositions[item.id] = item.position || input.stickerPositions?.[item.id] || input.stickerPosition || { x: 12 + index * 4, y: 18 + index * 4, width: 24, height: 20, aspectRatio: 1.2, targetUid: input.stickerTargetUid || restoredVideos[0]?.uid || '' };

                setSelectedStickers(restoredStickerItems);
                setActiveStickerId(restoredStickerItems[0]?.id || '');

                        const option = variationOptions.find(optionItem => optionItem.id === item);

                        return item;
                    }

                        restoredVariationValues[item.id] = item.value ?? variationOptions.find(optionItem => optionItem.id === item.id)?.defaultValue;
                        return item.id;
                    }
                    return '';

                setSelectedVariationOptions(restoredVariationIds);

                setReusePreviousCutResult(Boolean(data.previousCutResult));
                setResolutionPreset(input.resolutionPreset || CUSTOM_RESOLUTION);
                form.setFieldsValue({
                    taskName: input.taskName || data.taskName || '',

                    videoMaterials: restoredVideos,
                    generationMode: restoredMode,
                    stickers: restoredStickerItems,

                    resolutionWidth: input.resolutionWidth || null,

                return {
                    title: '可用组合数未达到目标数量',
                    summary: summary,
                    matched: matched,
                    target: target,
                    shortfall: shortfall,

                const oneToOneParameters = variationOptions.filter(option => variationValues[option.id] !== undefined && variationValues[option.id] !== null && variationValues[option.id] !== '').map(option => ({
                    id: option.id,
                    name: option.name,
                    value: variationValues[option.id],
                }));
                if (generationMode === 'one_to_many' && !selectedVariationOptions.length) {
                    message.warning('1 生多请至少选择 1 个变化参数');
                    return;

                if (generationMode === 'one_to_one' && !oneToOneParameters.length) {
                    message.warning('请至少填写 1 个变化参数');
                    return;
                }
                const payload = {
                    ...values,
                    generationMode,
                    variationParameters: generationMode === 'one_to_many' ? selectedVariationOptions.map(optionId => ({
                        id: optionId,
                        value: variationValues[optionId],
                    })) : oneToOneParameters,
                    imageMaterials: formatFiles(values.imageMaterials),
                    videoMaterials: formatFiles(values.videoMaterials),
                    variationOptions: (generationMode === 'one_to_many' ? selectedVariationOptions : oneToOneParameters.map(item => item.id)).map(optionId => ({
                        id: optionId,
                        name: variationOptions.find(option => option.id === optionId)?.name || optionId,
                        value: variationValues[optionId],
                    })),
                    stickers: selectedStickers.map(sticker => ({
                        ...sticker,

                // 解析 URL 参数获取来源

                message.success(reeditContext ? '已创建新任务，原任务仍会继续运行' : '任务已开始，您可在我的任务页中查看任务进度');
                
                // 延迟执行跳转和关闭，确保 Toast 能被看到并且正确回到原页面
                setTimeout(() => {
                    if (window.parent && window.parent !== window) {

                        window.parent.postMessage({ action: 'openTab', title: fromPage, url: fromUrl }, '*');

                }, 1500);

                if (getMediaType(file) !== mediaType) {
                    message.error(`${file.name} 文件类型不符合要求`);
                    return Upload.LIST_IGNORE;
                }

                if (mediaType === 'image' && (/\.gif$/i.test(file.name || '') || file.type === 'image/gif')) {
                    message.error('普通图像上传组件不支持 GIF，GIF 请使用贴纸类型上传');
                    return Upload.LIST_IGNORE;
                }

                const currentFiles = mediaType === 'image' ? imageFiles : videoFiles;
                if (maxCount && currentFiles.length >= maxCount) {
                    message.warning(`最多上传 ${maxCount} 个文件`);
                    return Upload.LIST_IGNORE;
                }

                return false;
            };

            const handleUploadChange = (info, mediaType, maxCount) => {
                const nextFiles = info.fileList
                    .filter(file => getMediaType(file) === mediaType)
                    .slice(0, maxCount || info.fileList.length)
                    .map(file => ({ ...file, status: 'done' }));

                if (mediaType === 'image') {
                    setImageFiles(nextFiles);
                    form.setFieldsValue({ imageMaterials: nextFiles });
                } else {
                    setVideoFiles(nextFiles);
                    if (!stickerTargetUid || !nextFiles.some(file => file.uid === stickerTargetUid)) {
                        setStickerTargetUid(nextFiles[0]?.uid || '');

                    form.setFieldsValue({ videoMaterials: nextFiles });
                }
                setReeditChanged(true);

                setReferenceTags({});
                setReferenceTaskStatus('all');
                setReferencePicker({

                    materialCategory: categories[0]?.key || '',
                    source,
                    lockSource: field === 'copyContent',
                    selectedTaskId: '',
                    selectedIds: [],
                });
            };

            const closeReferencePicker = () => {
                setReferencePicker(prev => ({ ...prev, open: false, selectedTaskId: '', selectedIds: [] }));
            };

            const matchReferenceOwner = item => {
                if (!materialLibrary.matchOwnership) return true;
                return materialLibrary.matchOwnership(item, referenceOwner);
            };

            const parseReferenceTime = value => new Date(String(value || '').replace(/-/g, '/')).getTime() || 0;

            const referenceMaterialCategories = materialLibrary.pickerCategories
                ? materialLibrary.pickerCategories(referencePicker.mediaType)
                : [{ key: 'actor', label: '演员', tagGroup: 'actor' }];

            const activeReferenceCategory = referenceMaterialCategories.find(item => item.key === referencePicker.materialCategory);
            const referenceTagGroupKey = activeReferenceCategory?.tagGroup || referencePicker.materialCategory;

            const referenceTagGroups = materialLibrary.groupsForType
                ? materialLibrary.groupsForType(referenceTagGroupKey)
                : (materialLibrary.tagGroups?.[referenceTagGroupKey] || []);

            const referenceLibraryItems = (referenceSources.library?.items || []).filter(item => (
                item.type === referencePicker.mediaType && item.materialType === referencePicker.materialCategory
            ));
            const referenceMineCount = referenceLibraryItems.filter(item => !materialLibrary.matchOwnership || materialLibrary.matchOwnership(item, 'mine')).length;
            const referenceWorkflowOptions = [...new Set(referenceLibraryItems.filter(item => item.source === '工作流').map(item => item.workflowName).filter(Boolean))];

            const setReferenceMaterialCategory = category => {
                setReferenceTags({});
                setReferencePicker(prev => ({ ...prev, materialCategory: category, selectedIds: [] }));
            };

            const openReferenceTagDialog = () => {
                setReferenceTagDialog({
                    open: true,
                    activeGroupId: referenceTagGroups[0]?.id || '',
                    draft: Object.fromEntries(Object.entries(referenceTags).map(([key, values]) => [key, [...values]])),
                });
            };

            const toggleReferenceTagDraft = (group, tag) => {
                setReferenceTagDialog(prev => {
                    const selected = prev.draft[group.id] || [];
                    const values = group.multiple
                        ? (selected.includes(tag) ? selected.filter(item => item !== tag) : [...selected, tag])
                        : (selected.includes(tag) ? [] : [tag]);
                    return { ...prev, draft: { ...prev.draft, [group.id]: values } };
                });
            };

            const clearReferenceTagDraft = () => {
                setReferenceTagDialog(prev => ({ ...prev, draft: {} }));
            };

            const cancelReferenceTagDialog = () => {
                setReferenceTagDialog(prev => ({ ...prev, open: false }));
            };

            const confirmReferenceTagDialog = () => {
                setReferenceTags(referenceTagDialog.draft);
                setReferenceTagDialog(prev => ({ ...prev, open: false }));
            };

            const removeReferenceTag = (groupId, tag) => {
                setReferenceTags(prev => ({
                    ...prev,
                    [groupId]: (prev[groupId] || []).filter(item => item !== tag),
                }));
            };

            const taskResultsByType = task => (task?.results || []).filter(item => item.type === referencePicker.mediaType);
            const productMaterialsByType = product => (product?.materials || []).filter(item => item.type === referencePicker.mediaType);

            const selectedReferenceTask = referencePicker.source === 'task'
                ? (referenceSources.task.items || []).find(task => task.id === referencePicker.selectedTaskId)
                : null;

            const selectedReferenceProduct = referencePicker.source === 'product'
                ? (referenceSources.product.items || []).find(product => product.id === referencePicker.selectedTaskId)
                : null;

            const referenceTaskList = (referenceSources.task.items || [])
                .filter(task => taskResultsByType(task).length > 0)
                .filter(task => referenceTaskStatus === 'all' || task.status === referenceTaskStatus)
                .filter(task => {
                    const q = referenceQuery.trim().toLowerCase();
                    if (!q) return true;
                    return [
                        task.name,
                        task.status,
                        task.createdAt,
                        taskResultsByType(task).map(item => [item.name, (item.tags || []).join(' ')].join(' ')).join(' ')
                    ].join(' ').toLowerCase().includes(q);
                })
                .sort((a, b) => parseReferenceTime(b.createdAt) - parseReferenceTime(a.createdAt));

            const referenceProductList = (referenceSources.product.items || [])
                .filter(product => productMaterialsByType(product).length > 0)
                .filter(product => {
                    const q = referenceQuery.trim().toLowerCase();
                    if (!q) return true;
                    return [
                        product.name,
                        product.category,
                        product.sku,
                        productMaterialsByType(product).map(item => [item.name, (item.tags || []).join(' ')].join(' ')).join(' ')
                    ].join(' ').toLowerCase().includes(q);
                });

            const availableReferenceItems = referencePicker.source === 'task'
                ? taskResultsByType(selectedReferenceTask)
                : referencePicker.source === 'product'
                    ? productMaterialsByType(selectedReferenceProduct)
                    : (referenceSources[referencePicker.source]?.items || []).filter(item => (
                        item.type === referencePicker.mediaType && item.materialType === referencePicker.materialCategory
                    ));

            const selectedReferenceItems = availableReferenceItems.filter(item => referencePicker.selectedIds.includes(item.id));

            const referenceItems = availableReferenceItems
                .filter(item => referencePicker.source !== 'library' || matchReferenceOwner(item))
                .filter(item => referencePicker.source !== 'library' || referenceSourceFilter === '全部' || item.source === referenceSourceFilter)
                .filter(item => referencePicker.source !== 'library' || referenceSourceFilter !== '工作流' || !referenceWorkflowName || item.workflowName === referenceWorkflowName)
                .filter(item => referencePicker.source !== 'library' || !materialLibrary.matchTagSelections || materialLibrary.matchTagSelections(item, referenceTags))
                .filter(item => {
                    if (referencePicker.source === 'library') return true;
                    const q = referenceQuery.trim().toLowerCase();
                    if (!q) return true;
                    return [
                        item.name,
                        item.owner,
                        item.source,
                        item.content,
                        (item.tags || []).join(' ')
                    ].join(' ').toLowerCase().includes(q);
                });

            const chooseReferenceTask = task => {
                setReferenceQuery('');
                setReferencePicker(prev => ({ ...prev, selectedTaskId: task.id, selectedIds: [] }));
            };

            const chooseReferenceProduct = product => {
                setReferenceQuery('');
                setReferencePicker(prev => ({ ...prev, selectedTaskId: product.id, selectedIds: [] }));
            };

            const backToReferenceTasks = () => {
                setReferenceQuery('');
                setReferencePicker(prev => ({ ...prev, selectedTaskId: '', selectedIds: [] }));
            };

            const setReferenceSource = source => {
                setReferenceQuery('');
                setReferenceSourceFilter('全部');
                setReferenceWorkflowName(undefined);
                setReferenceTags({});
                setReferenceTaskStatus('all');
                setReferencePicker(prev => ({ ...prev, source, selectedTaskId: '', selectedIds: [] }));
            };

            const toggleReferenceItem = id => {
                setReferencePicker(prev => {
                    const set = new Set(prev.selectedIds);
                    if (set.has(id)) set.delete(id);
                    else {
                        if (prev.field === 'sticker' && set.size >= DEFAULT_MAX_STICKERS) {
                            message.warning(`最多选择 ${DEFAULT_MAX_STICKERS} 个贴纸`);
                            return prev;
                        }
                        set.add(id);
                    }
                    return { ...prev, selectedIds: Array.from(set) };
                });
            };

            const referenceToFile = item => ({
                uid: `library-${item.id}-${Date.now()}`,
                name: item.name,
                type: item.type === 'video' ? 'video/mp4' : isGifReference(item) ? 'image/gif' : 'image/png',
                size: 0,
                status: 'done',
                url: item.url || item.thumb,
                thumbUrl: item.thumb || item.url,
                librarySource: item.source,
            });

            const referenceToSticker = item => ({
                id: `library-sticker-${item.id}`,
                name: item.name,
                type: isGifReference(item) ? 'image/gif' : 'image/png',
                meta: `系统资源 · ${isGifReference(item) ? 'GIF' : '图片'}`,
                thumb: item.thumb || item.url,
                url: item.url || item.thumb,
                symbol: '贴纸',
                color: 'linear-gradient(135deg,#595959,#1f1f1f)',
            });

            const confirmReferencePicker = () => {
                if (!selectedReferenceItems.length) return;
                if (referencePicker.field === 'sticker') {
                    addStickers(selectedReferenceItems.map(referenceToSticker));
                    message.success(`已添加 ${Math.min(selectedReferenceItems.length, Math.max(DEFAULT_MAX_STICKERS - selectedStickers.length, 0))} 个贴纸`);
                    closeReferencePicker();
                    return;
                }
                if (referencePicker.field === 'copyContent') {
                    const existing = String(form.getFieldValue('copyContent') || '').trim();
                    const copyText = selectedReferenceItems.map(item => item.content || item.name).filter(Boolean).join('\n\n');
                    form.setFieldsValue({ copyContent: [existing, copyText].filter(Boolean).join('\n\n') });
                    message.success(`已引用 ${selectedReferenceItems.length} 条文案`);
                    closeReferencePicker();
                    return;
                }
                const selected = selectedReferenceItems.map(referenceToFile);
                if (referencePicker.field === 'imageMaterials') {
                    const supported = selected.filter(file => file.type !== 'image/gif' && !/\.gif$/i.test(file.name || ''));
                    if (supported.length !== selected.length) message.warning('普通图像上传不支持 GIF，已忽略 GIF 资源；如需使用请添加到贴纸。');
                    const nextFiles = [...imageFiles, ...supported].slice(0, MAX_IMAGE_MATERIALS);
                    setImageFiles(nextFiles);
                    form.setFieldsValue({ imageMaterials: nextFiles });
                } else {
                    const nextFiles = [...videoFiles, ...selected];
                    setVideoFiles(nextFiles);
                    if (!stickerTargetUid) setStickerTargetUid(nextFiles[0]?.uid || '');
                    form.setFieldsValue({ videoMaterials: nextFiles });
                }
                message.success(`已引用 ${selected.length} 个${referencePicker.mediaType === 'video' ? '视频' : '图片'}`);
                closeReferencePicker();
            };

            const getReferenceOwnerLabel = item => {
                if (materialLibrary.ownershipLabel) return materialLibrary.ownershipLabel(item);
                return item.owner || '';
            };

            const getReferenceTitle = () => {
                const mediaLabel = referencePicker.mediaType === 'copy' ? '文案' : referencePicker.mediaType === 'video' ? '视频' : '图片';
                if (referencePicker.source === 'task' && selectedReferenceTask) {
                    return `${selectedReferenceTask.name} / 选择${mediaLabel}`;
                }
                if (referencePicker.source === 'product' && selectedReferenceProduct) {
                    return `${selectedReferenceProduct.name} / 选择${mediaLabel}`;
                }
                return `从${referenceSources[referencePicker.source]?.label || ''}选择${mediaLabel}`;
            };

            const previewReferenceItem = (event, item) => {
                event.stopPropagation();
                setPreview({
                    open: true,
                    title: item.name || '素材预览',
                    url: item.url || item.thumb,
                    type: item.type,
                    content: item.content || '',
                });
            };

            const isGifReference = item => {
                const type = String(item?.type || '').toLowerCase();
                if (type === 'gif' || type === 'image/gif') return true;
                return /\.gif(?:$|[?#\s])/i.test([
                    item?.name,
                    item?.fileName,
                    item?.mimeType,
                    item?.url,
                    item?.thumb,
                ].filter(Boolean).join(' '));
            };

            const renderReferenceMedia = item => {
                if (item.type === 'copy') {
                    return <div className="reference-thumb"><div className="reference-copy-thumb">{item.content || item.name}</div></div>;
                }
                const rawFileName = /\.[a-z0-9]+$/i.test(item.name || '')
                    ? item.name
                    : `${item.name || '原料'}.${item.type === 'video' ? 'mp4' : isGifReference(item) ? 'gif' : 'png'}`;
                if (item.type === 'video') {
                    return (
                        <div className="reference-thumb">
                            <img src={item.thumb || item.url} alt={item.name} />
                            {referencePicker.source === 'library' && <span className="reference-file-name">{rawFileName}</span>}
                            <span className="reference-play">▶</span>
                        </div>
                    );
                }
                return (
                    <div className="reference-thumb">
                        <img src={item.thumb || item.url} alt={item.name} />
                        {isGifReference(item) ? <span className="sticker-gif-tag" style={{ position: 'absolute', top: 8, left: 8 }}>GIF</span> : null}
                        {referencePicker.source === 'library' && <span className="reference-file-name">{rawFileName}</span>}
                    </div>
                );
            };

            const handlePreview = async file => {
                const mediaType = getMediaType(file);
                if (!mediaType) {
                    message.warning('当前文件暂不支持预览');
                    return;
                }

                const rawFile = getRawFile(file);
                const url = file.url || file.thumbUrl || URL.createObjectURL(rawFile);
                setPreview({
                    open: true,
                    title: file.name || '素材预览',
                    url,
                    type: mediaType,
                });
            };

            const handleResolutionPresetChange = event => {
                const value = event.target.value;
                setResolutionPreset(value);

                const preset = resolutionPresets.find(item => item.value === value);
                if (preset && preset.value !== CUSTOM_RESOLUTION) {
                    form.setFieldsValue({
                        resolutionWidth: preset.width,
                        resolutionHeight: preset.height,
                    });
                }
            };

            const markCustomResolution = () => {
                setResolutionPreset(CUSTOM_RESOLUTION);
                form.setFieldsValue({ resolutionPreset: CUSTOM_RESOLUTION });
            };

            const handleGenerationModeChange = event => {
                const value = event.target.value;
                setGenerationMode(value);
                form.setFieldsValue({ generationMode: value });
                setReeditChanged(true);
            };

            const toggleVariationOption = optionId => {
                setSelectedVariationOptions(prev => {
                    if (prev.includes(optionId)) {
                        const next = prev.filter(id => id !== optionId);
                        setVariationValues(values => {
                            const nextValues = { ...values };
                            delete nextValues[optionId];
                            return nextValues;
                        });
                        form.setFieldsValue({ variationOptions: next });
                        return next;
                    }
                    if (prev.length >= 9) {
                        message.warning('最多选择 9 个变化参数');
                        return prev;
                    }
                    const next = [...prev, optionId];
                    const option = variationOptions.find(item => item.id === optionId);
                    setVariationValues(values => ({ ...values, [optionId]: option?.defaultValue ?? 0 }));
                    form.setFieldsValue({ variationOptions: next });
                    return next;
                });
                setReeditChanged(true);
            };

            const updateVariationValue = (optionId, value) => {
                setVariationValues(values => {
                    const next = { ...values };
                    if (value === null || value === undefined || value === '') {
                        delete next[optionId];
                    } else {
                        next[optionId] = value;
                    }
                    return next;
                });
                setReeditChanged(true);
            };

            const selectedVariationCount = selectedVariationOptions.length;
            const videoCount = videoFiles.length;
            const oneToOneParameterCount = variationOptions.filter(option => variationValues[option.id] !== undefined && variationValues[option.id] !== null && variationValues[option.id] !== '').length;
            const estimatedVariationCount = generationMode === 'one_to_many'
                ? selectedVariationCount * videoCount
                : (oneToOneParameterCount > 0 ? videoCount : 0);

            const getDefaultStickerPosition = index => ({
                x: 12 + (index % 4) * 5,
                y: 16 + (index % 3) * 5,
                width: 24,
                height: 20,
                aspectRatio: 1.2,
                targetUid: stickerTargetUid || videoFiles[0]?.uid || '',
            });

            const isGifSticker = sticker => {
                const type = String(sticker?.type || '').toLowerCase();
                if (type === 'gif' || type === 'image/gif') return true;
                return /(?:\.gif(?:$|[?#\s])|(?:^|[\s·])gif(?:$|[\s·]))/i.test(`${sticker?.meta || ''} ${sticker?.name || ''}`);
            };

            const normalizeStickerItem = (sticker, index) => ({
                ...sticker,
                id: sticker.id || `sticker-${Date.now()}-${index}`,
                type: sticker.type || (isGifSticker(sticker) ? 'image/gif' : 'image/png'),
                meta: sticker.meta || '贴纸 · PNG',
            });

            const addStickers = items => {
                const incoming = (items || []).map(normalizeStickerItem);
                const existingIds = new Set(selectedStickers.map(item => item.id));
                const uniqueIncoming = incoming.filter(item => !existingIds.has(item.id));
                const availableCount = DEFAULT_MAX_STICKERS - selectedStickers.length;
                if (uniqueIncoming.length > availableCount) {
                    message.warning(`最多添加 ${DEFAULT_MAX_STICKERS} 个贴纸，已自动截取前 ${availableCount} 个`);
                }
                const accepted = uniqueIncoming.slice(0, Math.max(availableCount, 0));
                if (!accepted.length) return;
                const next = [...selectedStickers, ...accepted];
                const nextPositions = { ...stickerPositions };
                accepted.forEach((item, index) => {
                    nextPositions[item.id] = nextPositions[item.id] || getDefaultStickerPosition(selectedStickers.length + index);
                });
                setSelectedStickers(next);
                setStickerPositions(nextPositions);
                setActiveStickerId(accepted[0].id);
                setReeditChanged(true);
                // 用实际图片尺寸计算比例，后续拖拽/缩放始终保持贴纸原比例。
                accepted.forEach(item => {
                    const source = item.thumb || item.url;
                    if (!source) return;
                    const image = new Image();
                    image.onload = () => {
                        if (!image.naturalWidth || !image.naturalHeight) return;
                        const aspectRatio = image.naturalWidth / image.naturalHeight;
                        setStickerPositions(prev => {
                            const current = prev[item.id];
                            if (!current) return prev;
                            return {
                                ...prev,
                                [item.id]: { ...current, aspectRatio, height: current.width / aspectRatio },
                            };
                        });
                    };
                    image.src = source;
                });
            };

            const toggleStickerSelection = sticker => {
                const existing = selectedStickers.find(item => item.id === sticker.id);
                if (existing) {
                    removeSticker(sticker.id);
                    return;
                }
                addStickers([sticker]);
            };

            const handleStickerLocalUpload = event => {
                const files = Array.from(event.target.files || []);
                event.target.value = '';
                if (!files.length) return;
                const supported = files.filter(file => /\.(png|jpe?g|gif|webp)$/i.test(file.name || '') || /^image\/(png|jpe?g|gif|webp)$/i.test(file.type || ''));
                if (supported.length !== files.length) message.warning('仅支持 PNG、JPG、GIF、WEBP 等图片格式，已忽略不支持的文件');
                addStickers(supported.map(file => ({
                    id: `local-${Date.now()}-${file.name}`,
                    name: file.name,
                    type: file.type || (/\.gif$/i.test(file.name) ? 'image/gif' : 'image/png'),
                    meta: `本地上传 · ${/\.gif$/i.test(file.name) ? 'GIF' : '图片'}`,
                    thumb: URL.createObjectURL(file),
                    symbol: '贴纸',
                    color: 'linear-gradient(135deg,#595959,#1f1f1f)',
                })));
                setStickerPickerOpen(false);
            };

            const removeSticker = stickerId => {
                setSelectedStickers(prev => prev.filter(item => item.id !== stickerId));
                setStickerPositions(prev => {
                    const next = { ...prev };
                    delete next[stickerId];
                    return next;
                });
                setActiveStickerId(prev => prev === stickerId ? (selectedStickers.find(item => item.id !== stickerId)?.id || '') : prev);
                setReeditChanged(true);
            };

            const snapValue = value => {
                const targets = [0, 50, 100];
                const target = targets.find(item => Math.abs(item - value) <= 2);
                return target === undefined ? value : target;
            };

            const stickerPointerDown = (event, stickerId, mode) => {
                event.preventDefault();
                const canvas = event.currentTarget.closest('.sticker-preview-canvas');
                if (!canvas) return;
                canvas.setPointerCapture?.(event.pointerId);
                setActiveStickerId(stickerId);
                setStickerGuidesVisible(true);
                stickerDragRef.current = {
                    stickerId,
                    mode,
                    startX: event.clientX,
                    startY: event.clientY,
                    start: { ...(stickerPositions[stickerId] || getDefaultStickerPosition(0)) },
                };
            };

            const stickerPointerMove = event => {
                const drag = stickerDragRef.current;
                if (!drag) return;
                const canvas = event.currentTarget;
                const rect = canvas.getBoundingClientRect();
                const dx = ((event.clientX - drag.startX) / rect.width) * 100;
                const dy = ((event.clientY - drag.startY) / rect.height) * 100;
                if (drag.mode === 'resize') {
                    setStickerPositions(prev => {
                        const current = prev[drag.stickerId] || drag.start;
                        const width = Math.min(90, Math.max(6, drag.start.width + dx));
                        return { ...prev, [drag.stickerId]: { ...current, width, height: width / (current.aspectRatio || 1.2) } };
                    });
                } else {
                    setStickerPositions(prev => {
                        const current = prev[drag.stickerId] || drag.start;
                        return { ...prev, [drag.stickerId]: { ...current, x: snapValue(drag.start.x + dx), y: snapValue(drag.start.y + dy) } };
                    });
                }
            };

            const stickerPointerUp = event => {
                const canvas = event.currentTarget;
                canvas.releasePointerCapture?.(event.pointerId);
                stickerDragRef.current = null;
                setStickerGuidesVisible(false);
                setReeditChanged(true);
            };

            const renderStickerThumb = sticker => sticker?.thumb
                ? <img src={sticker.thumb} alt={sticker.name} />
                : <span>{sticker?.symbol || '贴纸'}</span>;

            const stickerPickerItems = stickerSource === 'library'
                ? stickerOptions.filter(item => item.meta.includes('原料库'))
                : stickerOptions.filter(item => item.meta.includes('官方贴纸'));

            const getOutputRatio = () => {
                if (stickerRatioConfig.source === 'fixed') return parseRatio(stickerRatioConfig.fixedRatio);
                if (stickerRatioConfig.source === 'video') return videoFiles.length ? getFileRatio(videoFiles[0]) : null;
                if (resolutionPreset === CUSTOM_RESOLUTION) {
                    const width = Number(form.getFieldValue('resolutionWidth'));
                    const height = Number(form.getFieldValue('resolutionHeight'));
                    return width > 0 && height > 0 ? { width, height } : null;
                }
                const preset = resolutionPresets.find(item => item.value === resolutionPreset);
                return preset ? { width: preset.width, height: preset.height } : null;
            };

            const outputRatio = getOutputRatio();
            const outputRatioLabel = formatRatioLabel(outputRatio);

            const resetForm = () => {
                form.resetFields();
                setImageFiles([]);
                setVideoFiles([]);
                setSelectedStickers([]);
                setActiveStickerId('');
                setStickerTargetUid('');
                setStickerPositions({});
                setStickerGuidesVisible(false);
                setGenerationMode('one_to_one');
                setSelectedVariationOptions([]);
                setVariationValues({});
                setResolutionPreset(CUSTOM_RESOLUTION);
                form.setFieldsValue({
                    imageMaterials: [],
                    videoMaterials: [],
                    generationMode: 'one_to_one',
                    variationOptions: [],
                    stickers: [],
                    resolutionPreset: CUSTOM_RESOLUTION,
                    resolutionWidth: null,
                    resolutionHeight: null,
                    durationMinSeconds: null,
                    durationMaxSeconds: null,
                    videoStyle: '写实风格',
                });
            };

            return (
                <ConfigProvider 
                    theme={{ 
                        token: { 
                            colorPrimary: '#4a9eff',
                            borderRadius: 6
                        } 
                    }}
                >
                    <div className="page-container">
                        <div className="page-title">视频去重工作流 V2，支持一个视频裂变多个视频</div>
                        {reeditContext?.showNotice && <div className="reedit-notice-wrap">{renderReeditNotice(reeditContext)}</div>}
                        
                        <Form 
                            form={form} 
                            layout="vertical" 
                            onFinish={onFinish}
                            onValuesChange={() => setReeditChanged(true)}
                            className="workflow-form"
                            initialValues={{ 
                                taskName: '',
                                copyContent: '',
                                imageMaterials: [],
                                videoMaterials: [],
                                generationMode: 'one_to_one',
                                variationOptions: [],
                                stickers: [],
                                resolutionPreset: CUSTOM_RESOLUTION,
                                resolutionWidth: null,
                                resolutionHeight: null,
                                durationMinSeconds: null,
                                durationMaxSeconds: null,
                                videoStyle: '写实风格',
                            }}
                        >
                            <div className="field-row">
                                <div className="field-meta">
                                    <div className="field-title-line">
                                        <span className="field-title">{fieldMeta.taskName.title}</span>
                                        <span className="required">*</span>
                                    </div>
                                    <p className="field-description">{fieldMeta.taskName.description}</p>
                                </div>
                                <div className="field-control">
                                    <Form.Item name="taskName" rules={[{ required: true, message: '请输入任务名称' }]}>
                                        <Input size="large" placeholder="请输入任务名称" allowClear />
                                    </Form.Item>
                                </div>
                            </div>

                            <div className="field-row">
                                <div className="field-meta">
                                    <div className="field-title-line">
                                        <span className="field-title">{fieldMeta.copyContent.title}</span>
                                    </div>
                                    <p className="field-description">{fieldMeta.copyContent.description}</p>
                                </div>
                                <div className="field-control">

                                        <Button className="reference-tag-trigger" onClick={openReferenceTagDialog}>
                                            <span>选择标签</span>
                                            <span>{Object.values(referenceTags).reduce((sum, values) => sum + values.length, 0) ? `已选 ${Object.values(referenceTags).reduce((sum, values) => sum + values.length, 0)} 项` : '请选择'}</span>
                                        </Button>
                                        <div className="reference-tag-applied">
                                            {referenceTagGroups.flatMap(group => (referenceTags[group.id] || []).map(tag => (
                                                <span className="reference-tag-applied-item" key={`${group.id}-${tag}`}>
                                                    {tag}
                                                    <button type="button" aria-label={`移除${tag}`} onClick={() => removeReferenceTag(group.id, tag)}>×</button>
                                                </span>
                                            )))}
                                        </div>
                                    </div>
                                </>
                            )}
                            {referencePicker.source === 'product' && (
                                <div className="reference-toolbar">
                                    {selectedReferenceProduct && (
                                        <button className="reference-back" type="button" onClick={backToReferenceTasks}>返回产品列表</button>
                                    )}
                                    <Input
                                        className="reference-search"
                                        value={referenceQuery}
                                        onChange={event => setReferenceQuery(event.target.value)}
                                        placeholder={!selectedReferenceProduct ? '搜索产品名称、品类、SKU' : '搜索物料名称、标签'}
                                        allowClear
                                    />
                                </div>
                            )}
                            {referencePicker.source === 'task' && (
                                <div className="reference-toolbar">
                                    {selectedReferenceTask && (
                                        <button className="reference-back" type="button" onClick={backToReferenceTasks}>返回任务列表</button>
                                    )}
                                    <Input
                                        className="reference-search"
                                        value={referenceQuery}
                                        onChange={event => setReferenceQuery(event.target.value)}
                                        placeholder={!selectedReferenceTask ? '搜索任务名称、时间、状态' : '搜索结果名称、标签'}
                                        allowClear
                                    />
                                    {!selectedReferenceTask && (
                                        <Select
                                            value={referenceTaskStatus}
                                            onChange={setReferenceTaskStatus}
                                            options={[
                                                { value: 'all', label: '全部状态' },
                                                { value: '已完成', label: '已完成' },
                                                { value: '生成中', label: '生成中' },
                                            ]}
                                            style={{ width: 132 }}
                                        />
                                    )}
                                </div>
                            )}
                        </div>
                        <div className="reference-picker-content">
                          <div className="reference-picker-main">
                          {referencePicker.source === 'product' && !selectedReferenceProduct ? (
                            <div className="reference-task-list">
                                {referenceProductList.map(product => (
                                    <button key={product.id} className="reference-task-card" type="button" onClick={() => chooseReferenceProduct(product)}>
                                        <div className="reference-task-leading"><img src={product.thumb} alt="" /></div>
                                        <div className="reference-task-body">
                                            <div className="reference-task-main">
                                                <span className="reference-task-name" title={product.name}>{product.name}</span>
                                            </div>
                                            <div className="reference-task-meta">
                                                <span>{product.category}</span>
                                                <span>{product.sku}</span>
                                                <span>{productMaterialsByType(product).length} 个{referencePicker.mediaType === 'video' ? '视频' : '图片'}物料</span>
                                            </div>
                                        </div>
                                        <span className="reference-task-chevron">›</span>
                                    </button>
                                ))}
                                {!referenceProductList.length && (
                                    <div className="reference-empty"><strong>没有匹配的产品物料</strong><span>调整搜索条件，或选择其他来源。</span></div>
                                )}
                            </div>
                        ) : referencePicker.source === 'task' && !selectedReferenceTask ? (
                            <div className="reference-task-list">
                                {referenceTaskList.map(task => {
                                    const results = taskResultsByType(task);
                                    return (
                                        <button key={task.id} className="reference-task-card" type="button" onClick={() => chooseReferenceTask(task)}>
                                            <div className="reference-task-leading">✓</div>
                                            <div className="reference-task-body">
                                                <div className="reference-task-main">
                                                    <span className="reference-task-name" title={task.name}>{task.name}</span>
                                                    <span className="reference-task-status">{task.status}</span>
                                                </div>
                                                <div className="reference-task-meta">
                                                    <span>{task.createdAt}</span>
                                                    <span>{results.length} 个{referencePicker.mediaType === 'copy' ? '文案' : referencePicker.mediaType === 'video' ? '视频' : '图片'}结果</span>
                                                </div>
                                            </div>
                                            <span className="reference-task-chevron">›</span>
                                        </button>
                                    );
                                })}
                                {!referenceTaskList.length && (
                                    <div className="reference-empty"><strong>没有匹配的任务</strong><span>仅展示包含当前字段所需内容的任务，请调整搜索或状态。</span></div>
                                )}
                            </div>
                        ) : (
                            <>
                                {referencePicker.source === 'task' && selectedReferenceTask && (
                                    <div className="reference-result-head">
                                        <span>{selectedReferenceTask.createdAt} · {selectedReferenceTask.status}</span>
                                        <span>{availableReferenceItems.length} 个可选结果</span>
                                    </div>
                                )}
                                {referencePicker.source === 'product' && selectedReferenceProduct && (
                                    <div className="reference-result-head">
                                        <span>{selectedReferenceProduct.category} · {selectedReferenceProduct.sku}</span>
                                        <span>{availableReferenceItems.length} 个可选物料</span>
                                    </div>
                                )}
                                <div className={`reference-grid ${referencePicker.mediaType === 'copy' ? 'copy-mode' : ''}`}>
                                    {referenceItems.map(item => (
                                        <div
                                            key={item.id}
                                            className={`reference-card ${item.type === 'copy' ? 'copy-card' : ''} ${referencePicker.selectedIds.includes(item.id) ? 'selected' : ''}`}
                                            onClick={() => toggleReferenceItem(item.id)}
                                        >
                                            {renderReferenceMedia(item)}
                                            {item.type !== 'copy' && referencePicker.source !== 'library' && <div className="reference-name" title={item.name}>{item.name}</div>}
                                            <div className="reference-tags">{(item.tags || []).slice(0, 3).join(' / ')}</div>
                                            <div className="reference-meta">
                                                <span>{item.createdAt || ''}</span>
                                                <span className="reference-meta-dot">·</span><span>{item.owner || ''}</span>
                                                <span className="reference-meta-dot">·</span><span>{item.source || ''}</span>
                                            </div>
                                            <div className="reference-card-actions">
                                                <button className="reference-preview-btn" type="button" onClick={event => previewReferenceItem(event, item)}>预览</button>
                                            </div>
                                        </div>
                                    ))}
                                    {!referenceItems.length && (
                                        <div className="reference-empty"><strong>没有可引用的内容</strong><span>调整创建者、标签或搜索条件后再试。</span></div>
                                    )}
                                </div>
                            </>
                          )}
                          </div>
                          {selectedReferenceItems.length > 0 && (
                              <aside className="reference-selected-panel">
                                  <div className="reference-selected-head">
                                      <span>已选 {selectedReferenceItems.length} 项</span>
                                      <button
                                          className="reference-selected-clear"
                                          type="button"
                                          onClick={() => setReferencePicker(prev => ({ ...prev, selectedIds: [] }))}
                                      >清空</button>
                                  </div>
                                  <div className="reference-selected-list">
                                      {selectedReferenceItems.map(item => (
                                          <div className="reference-selected-item" key={item.id}>
                                              {item.type === 'copy' ? (
                                                  <div className="reference-selected-preview copy">文案</div>
                                              ) : (
                                                  <div className="reference-selected-preview"><img src={item.thumb || item.url} alt="" /></div>
                                              )}
                                              <span className="reference-selected-name" title={item.type === 'copy' ? item.content : item.name}>{item.type === 'copy' ? item.content : item.name}</span>
                                              <button
                                                  className="reference-selected-remove"
                                                  type="button"
                                                  aria-label={`移除${item.name}`}
                                                  onClick={() => toggleReferenceItem(item.id)}
                                              >×</button>
                                          </div>
                                      ))}
                                  </div>
                              </aside>
                          )}
                        </div>
                          </div>
                        </div>
                      </div>
                    </Modal>
                    </div>
                    <Modal
                        open={referenceTagDialog.open}
                        title="选择标签"
                        width={760}
                        destroyOnClose
                        onCancel={cancelReferenceTagDialog}
                        footer={(
                            <div className="reference-tag-dialog-footer">
                                <Button type="link" onClick={clearReferenceTagDraft}>一键清空</Button>
                                <div className="reference-tag-dialog-footer-actions">
                                    <Button onClick={cancelReferenceTagDialog}>取消</Button>
                                    <Button type="primary" onClick={confirmReferenceTagDialog}>确认</Button>
                                </div>
                            </div>
                        )}
                    >
                        <div className="reference-tag-dialog-layout">
                            <div className="reference-tag-dialog-groups">
                                {referenceTagGroups.map(group => (
                                    <button
                                        className={`reference-tag-dialog-group ${referenceTagDialog.activeGroupId === group.id ? 'active' : ''}`}
                                        type="button"
                                        key={group.id}
                                        onClick={() => setReferenceTagDialog(prev => ({ ...prev, activeGroupId: group.id }))}
                                    >
                                        <span>{group.name}</span>
                                        <span>{(referenceTagDialog.draft[group.id] || []).length || ''}</span>
                                    </button>
                                ))}
                            </div>
                            <div className="reference-tag-dialog-main">
                                {referenceTagGroups.filter(group => group.id === referenceTagDialog.activeGroupId).map(group => (
                                    <React.Fragment key={group.id}>
                                        <div className="reference-tag-dialog-head">
                                            <strong>{group.name}</strong>
                                            <span>{group.multiple ? '可多选' : '单选'}</span>
                                        </div>
                                        <div className="reference-tag-dialog-options">
                                            {(group.tags || []).map(tag => (
                                                <button
                                                    className={`reference-tag-dialog-option ${group.multiple ? '' : 'single'} ${(referenceTagDialog.draft[group.id] || []).includes(tag) ? 'active' : ''}`}
                                                    type="button"
                                                    key={tag}
                                                    onClick={() => toggleReferenceTagDraft(group, tag)}
                                                >
                                                    <span className="reference-tag-dialog-check">{(referenceTagDialog.draft[group.id] || []).includes(tag) ? '✓' : ''}</span>
                                                    <span>{tag}</span>
                                                </button>
                                            ))}
                                        </div>
                                    </React.Fragment>
                                ))}
                            </div>
                        </div>
                        <div className="reference-tag-dialog-selected">
                            <div className="reference-tag-dialog-selected-title">已选标签</div>
                            <div className="reference-tag-applied">
                                {referenceTagGroups.flatMap(group => (referenceTagDialog.draft[group.id] || []).map(tag => (
                                    <span className="reference-tag-applied-item" key={`${group.id}-${tag}`}>
                                        {tag}
                                        <button type="button" aria-label={`移除${tag}`} onClick={() => toggleReferenceTagDraft(group, tag)}>×</button>
                                    </span>
                                )))}
                                {!Object.values(referenceTagDialog.draft).some(values => values.length) && <span className="reference-tag-empty">暂未选择</span>}
                            </div>
                        </div>
                    </Modal>
                    <Modal
                        open={preview.open}
                        title={preview.title}
                        footer={null}
                        width={720}
                        destroyOnClose
                        onCancel={() => setPreview({ open: false, title: '', url: '', type: '' })}
                    >
                        {preview.type === 'image' && (
                            <div style={{ position: 'relative', width: 'fit-content', maxWidth: '100%', margin: '0 auto' }}>
                                {isGifReference({ name: preview.title, url: preview.url }) && <span className="sticker-gif-tag" style={{ position: 'absolute', top: 8, left: 8, zIndex: 2 }}>GIF</span>}
                                <img src={preview.url} alt={preview.title} className="preview-media" />
                            </div>
                        )}
                        {preview.type === 'video' && <video src={preview.url} className="preview-media" controls />}
                        {preview.type === 'copy' && <div className="reference-copy-thumb">{preview.content || '暂无文案内容'}</div>}
                        {!preview.type && <p className="preview-empty">当前文件暂不支持预览</p>}
                    </Modal>
                    <Modal
                        open={stickerPickerOpen}
                        title="选择贴纸"
                        width={760}
                        className="sticker-picker-modal"
                        destroyOnClose
                        onCancel={() => setStickerPickerOpen(false)}
                        footer={<Button onClick={() => setStickerPickerOpen(false)}>取消</Button>}
                    >
                        <div className="sticker-picker-tabs">
                            {[
                                { value: 'official', label: '官方贴纸' },
                                { value: 'library', label: '原料库' },
                                { value: 'local', label: '本地上传' },
                            ].map(tab => (
                                <button key={tab.value} type="button" className={`sticker-picker-tab ${stickerSource === tab.value ? 'active' : ''}`} onClick={() => setStickerSource(tab.value)}>{tab.label}</button>
                            ))}
                        </div>
                        <div className="sticker-picker-content">
                            {stickerSource === 'local' ? (
                                <div className="sticker-picker-upload">
                                    <label htmlFor="sticker-local-file">
                                        <span style={{ fontSize: 28, color: '#1677ff' }}>＋</span>
                                        <strong>选择 PNG 或 GIF 文件</strong>
                                        <small>支持透明背景；单个文件建议不超过 10 MB</small>
                                        <input id="sticker-local-file" type="file" accept=".png,.gif,image/png,image/gif" onChange={handleStickerLocalUpload} />
                                    </label>
                                </div>
                            ) : (
                                <>
                                    <div className="sticker-picker-tip">选择后立即返回表单；贴纸实际作用对象在下方“位置预览”中指定。</div>
                                    <div className="sticker-option-grid">
                                        {stickerPickerItems.map(item => (
                                            <button key={item.id} type="button" className={`sticker-option ${selectedStickers.some(sticker => sticker.id === item.id) ? 'active' : ''}`} onClick={() => toggleStickerSelection(item)}>
                                                <div className="sticker-option-thumb" style={{ background: item.color }}>{renderStickerThumb(item)}</div>
                                                <span className="sticker-option-name">{item.name}</span>
                                                <span className="sticker-option-meta">{item.meta}</span>
                                            </button>
                                        ))}
                                    </div>
                                </>
                            )}
                        </div>
                    </Modal>
                </ConfigProvider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
