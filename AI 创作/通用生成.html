<script>
const createWfModal = document.getElementById('createWfModal');

function openCreateModal() {
    if (!createWfModal) return;
    if (localStorage.getItem('has_workflow_draft') === '1') {
        openConfirmModal({
            title: '提示',
            description: '检测到有未完成的工作流，是否进入上次编辑的工作流？',
            cancelText: '新建工作流',
            confirmText: '进入上次编辑',
            onConfirm: function() {
                parent.postMessage({
                    action: 'openTab',
                    title: '工作流编辑器',
                    url: 'AI 创作/工作流编辑器.html?draft=1'
                }, '*');
            },
            onCancel: function() {
                try { localStorage.removeItem('has_workflow_draft'); } catch(e) {}
                createWfModal.classList.add('active');
            }
        });
        return;
    }
    createWfModal.classList.add('active');
}

function closeCreateModal() {
    createWfModal.classList.remove('active');
    document.getElementById('wfName').value = '';
    document.getElementById('wfDesc').value = '';
    const coverInput = document.getElementById('wfCoverInput');
    if (coverInput) {
        coverInput.value = '';
        if (window.customCoverUrl) {
            URL.revokeObjectURL(window.customCoverUrl);
            window.customCoverUrl = null;
        }
        const tip = document.getElementById('wfCoverTip');
        const uploadText = document.getElementById('wfCoverUploadText');
        const deleteBtn = document.getElementById('wfCoverDeleteBtn');
        if (tip) tip.textContent = '默认根据名称自动生成，可选上传封面';
        if (uploadText) uploadText.textContent = '上传封面';
        if (deleteBtn) deleteBtn.style.display = 'none';
    }
    document.querySelector('input[name="wfType"][value="copy"]').checked = true;
    document.querySelector('input[name="wfVisibility"][value="private"]').checked = true;
    updateCoverPreview();
}

function getCoverText(name) {
    const clean = (name || '').replace(/\s+/g, '').trim();
    return (clean || '新建工作流').slice(0, 6);
}

function updateCoverPreview() {
    const preview = document.getElementById('wfCoverPreview');
    const nameInput = document.getElementById('wfName');
    
    if (!preview || !nameInput) return;
    
    if (window.customCoverUrl) {
        preview.innerHTML = `<img src="${window.customCoverUrl}" style="width:100%; height:100%; object-fit:cover; border-radius:inherit;">`;
        preview.style.background = 'transparent';
        preview.style.boxShadow = 'none';
        return;
    }

    const text = getCoverText(nameInput.value);
    preview.innerHTML = text.length > 3 ? `${text.slice(0, 3)}<br>${text.slice(3)}` : text;
    const palettes = [
        ['#4A9EFF', '#13c2c2'],
        ['#722ed1', '#eb2f96'],
        ['#fa8c16', '#fadb14'],
        ['#52c41a', '#4A9EFF']
    ];
    const idx = text.split('').reduce((sum, ch) => sum + ch.charCodeAt(0), 0) % palettes.length;
    preview.style.background = `linear-gradient(135deg, ${palettes[idx][0]}, ${palettes[idx][1]})`;
    preview.style.boxShadow = 'inset 0 0 0 1px rgba(255,255,255,0.22)';
}

function mockUploadCover(input) {
    const tip = document.getElementById('wfCoverTip');
    const uploadText = document.getElementById('wfCoverUploadText');
    const deleteBtn = document.getElementById('wfCoverDeleteBtn');
    
    if (input.files && input.files[0]) {
        const file = input.files[0];
        if (tip) tip.textContent = `已选择：${file.name}`;
        if (uploadText) uploadText.textContent = '重新上传';
        if (deleteBtn) deleteBtn.style.display = 'inline-flex';
        
        if (window.customCoverUrl) {
            URL.revokeObjectURL(window.customCoverUrl);
        }
        window.customCoverUrl = URL.createObjectURL(file);
        updateCoverPreview();
    }
}

function deleteUploadedCover() {
    const input = document.getElementById('wfCoverInput');
    const tip = document.getElementById('wfCoverTip');
    const uploadText = document.getElementById('wfCoverUploadText');
    const deleteBtn = document.getElementById('wfCoverDeleteBtn');
    
    if (input) input.value = '';
    if (tip) tip.textContent = '默认根据名称自动生成，可选上传封面';
    if (uploadText) uploadText.textContent = '上传封面';
    if (deleteBtn) deleteBtn.style.display = 'none';
    
    if (window.customCoverUrl) {
        URL.revokeObjectURL(window.customCoverUrl);
        window.customCoverUrl = null;
    }
    updateCoverPreview();
}

function submitCreate() {
    const name = document.getElementById('wfName').value;
    const visibility = document.querySelector('input[name="wfVisibility"]:checked')?.value || 'private';
    if (!name.trim()) {
        showToast('请输入工作流名称', 'error');
        return;
    }
    const params = new URLSearchParams({
        name: name.trim(),
        visibility
    });
    closeCreateModal();
    parent.postMessage({ 
        action: 'openTab', 
        title: name, 
        url: 'AI 创作/工作流编辑器.html?' + params.toString()
    }, '*');
}

if (createWfModal) {
    createWfModal.addEventListener('click', function(e) {
        if(e.target === this) closeCreateModal();
    });
}
</script>

<script>
// Paste to upload files
document.addEventListener('paste', function(e) {
    if (!e.clipboardData || !e.clipboardData.items) return;
    var files = [];
    for (var i = 0; i < e.clipboardData.items.length; i++) {
        var item = e.clipboardData.items[i];
        if (item.kind === 'file') {
            files.push(item.getAsFile());
        }
    }
    if (files.length > 0) {
        var validFiles = files.filter(f => f.type.startsWith('image/') || f.type.startsWith('video/'));
        if (validFiles.length > 0) {
            e.preventDefault();
            var dt = new DataTransfer();
            validFiles.forEach(f => dt.items.add(f));
            if (curType === 'chat') {
                var input = document.getElementById('chatMediaInput');
                input.files = dt.files;
                onChatMedia({ target: input });
            } else {
                var input = document.getElementById('uploadInput');
                input.files = dt.files;
                onUpload({ target: input });
            }
        }
    }
});

// 输入框随内容自动增高，最多额外增高 5 行，内容减少时自动回缩。
function autoGrowTextarea(textarea, defaultH, extraRows) {
    if (!textarea) return;
    const lineHeight = parseFloat(getComputedStyle(textarea).lineHeight) || 24;
    const maxH = defaultH + lineHeight * extraRows;
    textarea.style.height = defaultH + 'px';
    const nextH = Math.min(textarea.scrollHeight, maxH);
    textarea.style.height = Math.max(defaultH, nextH) + 'px';
    textarea.style.overflowY = textarea.scrollHeight > maxH ? 'auto' : 'hidden';
}

setTimeout(function() {
    autoGrowTextarea(document.getElementById('prompt'), 108, 5);
}, 0);
</script>

let promptInputApi = null;

function initPromptMediaInput() {
    if (promptInputApi || !window.CCPromptMediaInput) return promptInputApi;
    promptInputApi = CCPromptMediaInput.init({
        source: 'prompt',
        editor: 'promptEditor',
        getReferences: function() {
            return CCPromptMediaInput.collectReferences(document.getElementById('refStrip'), '.ref-item');
        },
        onAddReference: function() {
            const input = document.getElementById('uploadInput');
            if (input) input.click();
        },
        onChange: function() { onInput(); }
    });
    return promptInputApi;
}

function getPromptText() {
    return promptInputApi ? promptInputApi.getText() : (document.getElementById('prompt')?.value || '').trim();
}

function setPromptText(value) {
    if (promptInputApi) promptInputApi.setText(value || '');
    else {
        const prompt = document.getElementById('prompt');
        if (prompt) prompt.value = value || '';
    }
    onInput();
}

function focusPromptInput() {
    if (promptInputApi) promptInputApi.focus();
    else document.getElementById('prompt')?.focus();
}

function setPromptPlaceholder(value) {
    if (promptInputApi) promptInputApi.setPlaceholder(value || '');
    else {
        const prompt = document.getElementById('prompt');
        if (prompt) prompt.placeholder = value || '';
    }
}

function getOptionIconKey(opt) {
    if (opt.type === 'ratio-res' || opt.type === 'ratio-dur' || opt.type === 'ratio') return 'ratio';
    if (opt.type === 'chips' && opt.key === 'mode') return 'mode';
    return OPTION_ICONS[opt.key] ? opt.key : opt.type;
}

function optionIconHtml(opt) {
    const icon = opt.type === 'model'
        ? (TYPE_ICONS[curType] || TYPE_ICONS.image)
        : (OPTION_ICONS[getOptionIconKey(opt)] || TYPE_ICONS.image);
    return '<span class="type-opt-icon" aria-hidden="true">' + icon + '</span>';
}

function withOptionIcon(opt, content) {
    return optionIconHtml(opt) + content;
}

function hasInlinePillIcon(opt) {
    return opt.type === 'ratio-res' || opt.type === 'ratio-dur' || opt.type === 'ratio';
}

function ratioPillIconHtml(width, height) {
    return `<span class="pill-ratio-box" style="width:${width}px;height:${height}px;"></span>`;
}

function setGenerateButtonLabel() {
    const genText = document.getElementById('genText');
    if (genText) genText.innerHTML = '<span class="gen-btn-icon" aria-hidden="true">' + GENERATE_ICON + '</span><span>生成</span>';
}

function renderTypeIcons() {
    document.querySelectorAll('[data-type-icon]').forEach(el => {
        const type = el.dataset.typeIcon || 'image';
        el.innerHTML = TYPE_ICONS[type] || TYPE_ICONS.image;
    });
}

function onInput() {
    const has = getPromptText().length > 0;
    document.getElementById('genBtn').className = 'gen-btn' + (has ? ' has-text' : '');
    const clearBtn = document.getElementById('promptClearBtn');
    if (clearBtn) {
        clearBtn.disabled = !has;
        clearBtn.classList.toggle('has-text', has);
    }
    syncToolboxFormatState();
}

function clearPrompt() {
    if (!getPromptText()) {
        focusPromptInput();
        return;
    }
    setPromptText('');
    focusPromptInput();
}

function showUploadMenu(e, anchor) {

    const dd = document.getElementById('uploadDropdown');
    if (dd.classList.contains('show')) { dd.classList.remove('show'); return; }
    const rect = anchor.getBoundingClientRect();
    dd.style.left = rect.left + 'px';
    dd.style.top = (rect.bottom + 6) + 'px';
    dd.classList.add('show');
}

function triggerUpload() {
    document.getElementById('uploadDropdown').classList.remove('show');
    document.getElementById('uploadInput').click();
}

// ── 对话附件 ──
let chatAttachments = [];
let _chatAttachId = 0;

function showChatAttachMenu(e, anchor) {
    e.stopPropagation();
    const dd = document.getElementById('chatAttachDropdown');
    if (dd.classList.contains('show')) { dd.classList.remove('show'); return; }
    const rect = anchor.getBoundingClientRect();
    dd.style.left = rect.left + 'px';
    dd.style.top = (rect.bottom + 6) + 'px';
    dd.classList.add('show');
}
document.addEventListener('click', () => document.getElementById('chatAttachDropdown')?.classList.remove('show'));

function onChatMedia(e) {
    Array.from(e.target.files).forEach(f => {
        const isVideo = f.type.startsWith('video/');
        const url = URL.createObjectURL(f);
        const id = 'ca' + (++_chatAttachId);
        chatAttachments.push({ id, type: 'media', url, name: f.name, isVideo });
    });
    e.target.value = '';
    renderChatAttachStrip();
}

function onChatFile(e) {
    Array.from(e.target.files).forEach(f => {
        const id = 'ca' + (++_chatAttachId);
        const ext = f.name.split('.').pop().toLowerCase();
        const imageExts = ['jpg','jpeg','png','gif','webp','bmp','svg','heic','tiff'];
        const videoExts = ['mp4','webm','mov','avi','mkv','m4v'];
        const isMedia = f.type.startsWith('image/') || f.type.startsWith('video/')
                     || imageExts.includes(ext) || videoExts.includes(ext);
        const isVideo = f.type.startsWith('video/') || videoExts.includes(ext);
        if (isMedia) {
            const url = URL.createObjectURL(f);
            chatAttachments.push({ id, type: 'media', url, name: f.name, isVideo });
        } else {
            chatAttachments.push({ id, type: 'file', name: f.name });
        }
    });
    e.target.value = '';
    renderChatAttachStrip();
}

function removeChatAttach(id) {
    chatAttachments = chatAttachments.filter(a => a.id !== id);
    renderChatAttachStrip();
}

function renderChatAttachStrip() {
    const strip = document.getElementById('chatAttachStrip');
    if (!chatAttachments.length) {
        strip.innerHTML = '';
        strip.style.display = 'none';
        return;
    }
    strip.style.display = 'flex';
    strip.innerHTML = chatAttachments.map(a => {
        if (a.type === 'media') {
            const mediaHtml = a.isVideo
                ? `<video src="${a.url}" muted playsinline preload="metadata" style="width:100%;height:100%;object-fit:cover;display:block"></video><div class="ref-video-mark">▶</div>`
                : `<img src="${a.url}" style="width:100%;height:100%;object-fit:cover;display:block">`;
            return `<div class="ref-item" style="position:relative;width:60px;height:60px;border-radius:8px;overflow:hidden;flex-shrink:0;border:1px solid rgba(0,0,0,0.08);background:#f0f0f0">
                ${mediaHtml}
                <div class="ref-del" style="display:none" onclick="removeChatAttach('${a.id}')">✕</div>
            </div>`;
        } else {
            return `<div class="chat-file-card">
                <svg class="chat-file-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span class="chat-file-name" title="${a.name}">${a.name}</span>
                <div class="chat-attach-del" onclick="removeChatAttach('${a.id}')">✕</div>
            </div>`;
        }
    }).join('');
}

let _promptRefId = 0;

function refAttr(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function(ch) {
        return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[ch];
    });
}

function inferReferenceType(name, url, fallback) {
    const text = [fallback || '', name || '', url || ''].join(' ');
    return /video|\.((mp4)|(mov)|(webm)|(m4v))(\?|#|$|\s)/i.test(text) ? 'video' : 'image';
}

function normalizeReference(input) {
    input = input || {};
    const url = input.url || input.thumb || '';
    const type = inferReferenceType(input.name, url, input.type || input.assetType);
    return {
        id: input.id || ('prompt-ref-' + (++_promptRefId)),
        type,
        url,
        thumb: input.thumb || url,
        name: input.name || input.fileName || input.filename || (type === 'video' ? '参考视频' : '参考图片')
    };
}

function ensureRefAddButton() {
    const strip = document.getElementById('refStrip');
    if (document.getElementById('refAddBtn')) return;
    document.getElementById('uploadBlock').style.display = 'none';
    const addBtn = document.createElement('div');
    addBtn.className = 'ref-add';
    addBtn.id = 'refAddBtn';
    addBtn.onclick = function(ev) { showUploadMenu(ev, this); };
    addBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>`;
    strip.insertBefore(addBtn, strip.firstChild);
    syncToolboxParseState();
}

function referenceMediaHtml(ref) {
    const src = refAttr(ref.thumb || ref.url);
    if (ref.type === 'video') {
        return `<video src="${src}" muted playsinline preload="metadata"></video><div class="ref-video-mark">▶</div>`;
    }
    return `<img src="${src}" alt="${refAttr(ref.name)}" style="cursor:pointer" onclick="previewImage('${refAttr(ref.url)}')">`;
}

function appendReferenceItem(ref) {
    ref = normalizeReference(ref);
    if (curType === 'chat') {
        const id = 'ca' + (++_chatAttachId);
        chatAttachments.push({ id, type: 'media', url: ref.url, name: ref.name, isVideo: ref.type === 'video' });
        renderChatAttachStrip();
        return;
    }
    ensureRefAddButton();
    const strip = document.getElementById('refStrip');
    const item = document.createElement('div');
    item.className = 'ref-item';
    item.setAttribute('data-ref-id', ref.id);
    item.setAttribute('data-ref-type', ref.type);
    item.setAttribute('data-ref-url', ref.url);
    item.setAttribute('data-ref-thumb', ref.thumb || ref.url);
    item.setAttribute('data-ref-name', ref.name);
    item.innerHTML = referenceMediaHtml(ref) + '<div class="ref-del" onclick="removeRef(this)">✕</div>';
    strip.appendChild(item);
    syncToolboxParseState();
}

function onUpload(e) {
    if (curType === 'chat') {
        Array.from(e.target.files).forEach(f => {
            const url = URL.createObjectURL(f);
            const id = 'ca' + (++_chatAttachId);
            chatAttachments.push({ id, type: 'media', url, name: f.name, isVideo: f.type.startsWith('video/') });
        });
        e.target.value = '';
        renderChatAttachStrip();
        return;
    }
    Array.from(e.target.files).forEach(f => {
        const url = URL.createObjectURL(f);
        appendReferenceItem({ url, thumb: url, name: f.name, type: f.type.startsWith('video/') ? 'video' : 'image' });
    });
    e.target.value = '';
    syncToolboxParseState();
}

// 从素材库弹窗添加参考图片/视频
function addRefFromUrl(url, name, type, thumb) {
    appendReferenceItem({ url, thumb: thumb || url, name: name || String(url || '').split('/').pop(), type });
}

function addRefFromAsset(asset) {
    asset = asset || {};
    addRefFromUrl(asset.url || asset.thumb, asset.name, asset.type || asset.assetType, asset.thumb || asset.url);
}

function removeRef(btn) {
    btn.parentElement.remove();
    // 所有缩略图都删完了：移除小添加按钮，恢复左侧大按钮
    const strip = document.getElementById('refStrip');
    if (!strip.querySelector('.ref-item')) {
        document.getElementById('refAddBtn')?.remove();
        document.getElementById('uploadBlock').style.display = '';
        syncToolboxParseState();
    } else {
        syncToolboxParseState();
    }
}

// ── 首尾帧 ──
function renderKeyframeStrip() {
    const strip = document.getElementById('keyframeStrip');
    const isKeyframe = curType === 'video' && sel.video.mode === '首尾帧';
    if (!isKeyframe) {
        strip.classList.remove('show');
        // 恢复上传块（如果没有普通参考图则显示）
        if (!document.getElementById('refAddBtn')) {
            document.getElementById('uploadBlock').style.display = '';
        }
        return;
    }
    strip.classList.add('show');
    // 首尾帧模式隐藏左侧大上传按钮
    document.getElementById('uploadBlock').style.display = 'none';

    function slotHTML(frameKey, label, inputId) {
        const url = sel.video[frameKey];
        const boxHTML = url
            ? `<div class="keyframe-slot-box">
                   <div class="keyframe-thumb" onclick="previewImage('${url}')">
                       <img src="${url}" alt="">
                   </div>
                   <div class="keyframe-del" onclick="removeKeyframe('${frameKey}')">✕</div>
               </div>`
            : `<div class="keyframe-add" onclick="document.getElementById('${inputId}').click()">
                   <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
               </div>`;
        return `<div class="keyframe-slot">${boxHTML}<span class="keyframe-lbl">${label}</span></div>`;
    }

    strip.innerHTML = slotHTML('frameFirst', '首帧', 'uploadFirst')
        + `<div class="keyframe-arrow">→</div>`
        + slotHTML('frameLast', '尾帧', 'uploadLast');
}

function onUploadFrame(e, frameKey) {
    const f = e.target.files[0];
    if (!f) return;
    if (sel.video[frameKey]) URL.revokeObjectURL(sel.video[frameKey]);
    sel.video[frameKey] = URL.createObjectURL(f);
    e.target.value = '';
    renderKeyframeStrip();
}

function removeKeyframe(frameKey) {
    if (sel.video[frameKey]) URL.revokeObjectURL(sel.video[frameKey]);
    sel.video[frameKey] = null;
    renderKeyframeStrip();
}

function previewImage(url) {
    showAssetPreview(url);
}

function normalizeAssetItem(item, source) {
    item = item || {};

        content: item.content || '',
        tags: item.tags || [],
        source: item.source || source || '',
        owner: item.owner || (source === '我的任务' ? SHARED_MATERIAL_LIBRARY.currentUser?.name : ''),
        visibility: item.visibility || (source === '我的任务' ? '仅自己' : ''),
        createdAt: item.createdAt || '',
        downloads: item.downloads || 0,
        references: item.references || 0
    };
    normalized.ownershipLabel = SHARED_MATERIAL_LIBRARY.ownershipLabel ? SHARED_MATERIAL_LIBRARY.ownershipLabel(normalized) : '';
    return {
        ...normalized
    };
}

function toggleAssetTag(groupId, tag, multiple) {
    const current = new Set(assetTagSelections[groupId] || []);
    if (current.has(tag)) current.delete(tag);
    else if (multiple) current.add(tag);
    else {
        current.clear();
        current.add(tag);
    }
    assetTagSelections[groupId] = Array.from(current);
    renderFilterBar();
    renderAssetGrid();
}

function renderAssetTagDialog() {
    const groups = assetTagGroups();
    const activeGroup = groups.find(group => group.id === assetTagDialogGroupId) || groups[0];
    if (activeGroup) assetTagDialogGroupId = activeGroup.id;
    document.getElementById('assetTagDialogGroups').innerHTML = groups.map(group => {
        const count = (assetTagDraft[group.id] || []).length;
        return `<button class="asset-tag-dialog-group${group.id === assetTagDialogGroupId ? ' active' : ''}" type="button" onclick="setAssetTagDialogGroup(decodeURIComponent('${encodeURIComponent(group.id)}'))"><span>${refAttr(group.name)}</span><span>${count || ''}</span></button>`;
    }).join('');
    document.getElementById('assetTagDialogOptions').innerHTML = activeGroup
        ? `<div class="asset-tag-group-head">${refAttr(activeGroup.name)}<span>${activeGroup.multiple ? '多选' : '单选'}</span></div><div class="asset-tag-dialog-options">${(activeGroup.tags || []).map(tag => {
            const active = (assetTagDraft[activeGroup.id] || []).includes(tag);
            return `<button class="asset-tag-option${activeGroup.multiple ? '' : ' single'}${active ? ' active' : ''}" type="button" onclick="toggleAssetTagDraft(decodeURIComponent('${encodeURIComponent(activeGroup.id)}'),decodeURIComponent('${encodeURIComponent(tag)}'))"><span class="asset-tag-check">${active ? '✓' : ''}</span><span>${refAttr(tag)}</span></button>`;
        }).join('')}</div>`
        : '<div class="asset-list-empty">当前分类暂无标签分组</div>';
    const selected = groups.flatMap(group => (assetTagDraft[group.id] || []).map(tag => ({ groupId:group.id, tag })));
    document.getElementById('assetTagDialogSelected').innerHTML = selected.length
        ? selected.map(item => `<span class="asset-tag-applied-item">${refAttr(item.tag)}<button type="button" onclick="toggleAssetTagDraft(decodeURIComponent('${encodeURIComponent(item.groupId)}'),decodeURIComponent('${encodeURIComponent(item.tag)}'))">×</button></span>`).join('')
        : '<span class="asset-tag-dialog-selected-title">暂未选择标签</span>';
}

function setAssetTagDialogGroup(groupId) {
    assetTagDialogGroupId = groupId;
    renderAssetTagDialog();
}

function toggleAssetTagDraft(groupId, tag) {
    const group = assetTagGroups().find(item => item.id === groupId);
    const current = new Set(assetTagDraft[groupId] || []);
    if (current.has(tag)) current.delete(tag);
    else if (group?.multiple) current.add(tag);
    else { current.clear(); current.add(tag); }
    assetTagDraft[groupId] = Array.from(current);
    renderAssetTagDialog();
}

function filterAssetTagOptions(input) {
    const q = input.value.trim().toLowerCase();
    assetTagQuery = q;
    input.parentElement.querySelectorAll('.asset-tag-group').forEach(group => {
        const groupText = group.querySelector('.asset-tag-group-head').textContent.toLowerCase();
        let visible = false;
        group.querySelectorAll('.asset-tag-option').forEach(option => {
            const show = !q || groupText.includes(q) || option.dataset.tagText.includes(q);
            option.style.display = show ? '' : 'none';
            visible = visible || show;
        });
        group.style.display = visible ? '' : 'none';
    });
}

function renderTaskList() {
    const wrap = document.getElementById('assetGridWrap');
    const grid = document.getElementById('assetGrid');
    wrap.style.display = '';
    grid.className = 'task-list';
    const query = assetSearchQuery.trim().toLowerCase();
    const tasks = (SHARED_MATERIAL_LIBRARY.tasks || []).filter(task => {
        const results = taskResultsForCurrentType(task);
        if (!results.length) return false;
        if (assetTaskStatus !== 'all' && task.status !== assetTaskStatus) return false;
        if (!query) return true;
        return [task.name, task.createdAt, task.status, ...results.map(item => item.name)].join(' ').toLowerCase().includes(query);
    }).sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
    if (!tasks.length) {
        grid.innerHTML = '<div class="asset-list-empty">没有匹配的任务</div>';
        return;
    }
    grid.innerHTML = tasks.map(t => {
        const results = taskResultsForCurrentType(t);
        const statusKey = t.status === '已完成' ? 'done' : t.status === '生成中' ? 'running' : 'failed';
        return `
        <div class="task-row" onclick="openTaskDetail('${t.id}')">
            <div class="task-row-icon ${statusKey}">
                ${statusKey === 'done' ? '✓' : statusKey === 'running' ? '⟳' : '✕'}
            </div>
            <div class="task-row-body">
                <div class="task-row-title">${t.name}</div>
                <div class="task-row-meta">
                    <span>${t.createdAt || ''}</span>
                    <span>${results.length} 个${SHARED_MATERIAL_LIBRARY.typeLabel(assetCurrentType)}结果</span>
                </div>
            </div>
            <span class="task-row-status ${statusKey}">${t.status || ''}</span>
            <span class="task-row-arrow">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
            </span>
        </div>
    `; }).join('');
}

function taskResultsForCurrentType(task) {
    return (task?.results || []).filter(item => item.type === assetCurrentType).map(item => normalizeAssetItem(item, '我的任务'));
}

function productMaterialsForCurrentType(product) {
    return (product?.materials || []).filter(item => item.type === assetCurrentType);
}

function renderProductList() {
    const wrap = document.getElementById('assetGridWrap');
    const grid = document.getElementById('assetGrid');
    wrap.style.display = '';
    grid.className = 'task-list';
    const query = assetSearchQuery.trim().toLowerCase();
    const products = MOCK_PRODUCTS.filter(product => {
        const materials = productMaterialsForCurrentType(product);
        if (!materials.length) return false;
        if (assetProductCategory && product.category !== assetProductCategory) return false;
        if (assetProductId && product.id !== assetProductId) return false;
        if (!query) return true;
        return [product.name, product.category, product.sku, ...materials.map(item => item.name)].join(' ').toLowerCase().includes(query);
    });
    if (!products.length) {
        grid.innerHTML = '<div class="asset-list-empty">没有匹配的产品物料</div>';
        return;
    }
    grid.innerHTML = products.map(p => `
        <div class="task-row" onclick="openProductDetail('${p.id}')">
            <div style="width:40px;height:40px;border-radius:8px;overflow:hidden;flex-shrink:0;background:#f0f0f0">
                <img src="${p.thumb}" style="width:100%;height:100%;object-fit:cover;display:block" alt="">
            </div>
            <div class="task-row-body">
                <div class="task-row-title">${p.name}</div>
                <div class="task-row-meta">
                    <span>${p.category}</span>

                    <span>${productMaterialsForCurrentType(p).length} 个${SHARED_MATERIAL_LIBRARY.typeLabel(assetCurrentType)}物料</span>
                </div>
            </div>
            <span class="task-row-arrow">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
            </span>
        </div>
    `).join('');
}

function getAssetById(id) {
    const pools = [MOCK_ASSETS[assetCurrentCat] || [], MOCK_ASSETS['原料库'] || [], MOCK_ASSETS['我的任务'] || []];
    for (const pool of pools) {
        const found = pool.find(item => item.id === id);
        if (found) return found;
    }
    for (const task of (SHARED_MATERIAL_LIBRARY.tasks || [])) {
        const found = (task.results || []).find(item => item.id === id);
        if (found) return normalizeAssetItem(found, '我的任务');
    }
    for (const product of MOCK_PRODUCTS) {
        const found = product.materials.find(item => item.id === id);
        if (found) return normalizeAssetItem(found, '产品物料');
    }
    return null;
}

function getVisibleAssetItems() {
    const items = MOCK_ASSETS[assetCurrentCat] || [];
    const q = assetSearchQuery.trim().toLowerCase();
    return items.filter(item => {
        if (item.type !== assetCurrentType) return false;
        if (assetCurrentCat === '原料库' && item.materialType !== assetCurrentMaterialCategory) return false;
        if (SHARED_MATERIAL_LIBRARY.matchOwnership && !SHARED_MATERIAL_LIBRARY.matchOwnership(item, assetOwnerScope)) return false;
        if (SHARED_MATERIAL_LIBRARY.matchTagSelections && !SHARED_MATERIAL_LIBRARY.matchTagSelections(item, assetTagSelections)) return false;
        if (!q) return true;
        const text = [item.name, item.format, item.source, item.owner, item.content || '', (item.tags || []).join(' ')].join(' ').toLowerCase();
        return text.includes(q);
    });
}

function assetMediaHtml(a) {
    if (a.type === 'copy') {
        return `<div class="asset-copy-thumb">${refAttr(a.content || a.name)}</div>`;
    }
    const rawFileName = /\.[a-z0-9]+$/i.test(a.name || '')
        ? a.name
        : `${a.name || '原料'}.${a.type === 'video' ? 'mp4' : 'png'}`;
    const fileLabel = assetCurrentCat === '原料库'
        ? `<span class="asset-file-name" title="${refAttr(rawFileName)}">${refAttr(rawFileName)}</span>`
        : '';
    if (a.type === 'video') {
        return `<img src="${refAttr(a.thumb || a.url)}" alt="${refAttr(a.name)}" loading="lazy">${fileLabel}<span class="asset-video-mark">▶</span>`;
    }
    return `<img src="${refAttr(a.thumb || a.url)}" alt="${refAttr(a.name)}" loading="lazy">${fileLabel}`;
}

function assetTagLine(a) {
    const tags = (a.tags || []).slice(0, 3);
    if (tags.length) return tags.join(' / ');
    return a.source || '';
}

function toggleAssetCard(e, id, thumb, name, type) {
    const card = e.currentTarget;
    if (assetSelected.has(id)) {
        assetSelected.delete(id);

    } else {
        const item = getAssetById(id) || normalizeAssetItem({ id, thumb, name, type }, assetCurrentCat);
        assetSelected.add(id);
        assetSelectedMap.set(id, item);
        card.classList.add('selected');

}

// ── 尺寸推算 ──
function updateSize(ratio, res) {
    const base = res === '4K' ? 4096 : res === '3K' ? 3072 : res === '1K' ? 1024 : 2048;
    const parts = ratio.split(':').map(Number);
    if (parts.length !== 2 || !parts[1]) {
        sel[curType].sizeW = sel[curType].sizeH = base;
    } else {
        const [a, b] = parts;
        if (a >= b) { sel[curType].sizeW = base; sel[curType].sizeH = Math.round(base * b / a); }
        else        { sel[curType].sizeH = base; sel[curType].sizeW = Math.round(base * a / b); }
    }
}

                                tagsHtml = mx.tags.map(t => `<span style="background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-left: 6px; color: var(--text-2);">${t}</span>`).join('');
                            }
                            
                            let paramSelectHtml = '';
                            if (curType !== 'chat') {
                                paramSelectHtml = `<select class="model-param-select"
                                            onchange="setModelParam(event,'${mx.id}','${curType === 'video' ? 'duration' : 'quality'}')">
                                        ${paramValues.map(v => `<option value="${v}"${v === paramValue ? ' selected' : ''}>${paramLabel}：${v}</option>`).join('')}
                                    </select>`;
                            }
                            
                            return `<div class="model-opt-row${checked ? ' checked' : ''}" data-desc="${mx.desc || ''}"
                                         onclick="toggleModel(event,'${mx.id}')">
                                <div class="model-check${checked ? ' active' : ''}"></div>
                                <span class="model-opt-name">${mx.name}</span>
                                ${tagsHtml}
                                <div class="model-config-wrap" onclick="event.stopPropagation()">
                                    <div class="model-count-wrap">
                                        <input class="model-count-input" type="number" min="1" max="99"
                                               value="${cnt}"
                                               placeholder="1"
                                               onchange="setModelCount(event,'${mx.id}')"
                                               onkeydown="if(event.key==='Enter'){event.target.blur()}">
                                        <span class="model-count-unit">${countUnit}</span>
                                    </div>
                                    ${paramSelectHtml}
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`;
            } else {
                ddInner = `<div class="dd-section">
                    ${searchHtml}
                    ${curType === 'chat' ? '' : '<div class="dd-section-title">模型</div>'}
                    <div class="model-list">
                        ${modelList.map(mx => {
                            const checked = models.includes(mx.id);
                            let tagsHtml = '';
                            if (curType === 'chat' && mx.tags && mx.tags.length > 0) {
                                tagsHtml = mx.tags.map(t => `<span style="background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-left: 6px; color: var(--text-2);">${t}</span>`).join('');
                            }
                            return `<div class="model-opt-row${checked ? ' checked' : ''}" data-desc="${mx.desc || ''}"
                                         onclick="toggleModel(event,'${mx.id}')">
                                <div class="model-check${checked ? ' active' : ''}"></div>
                                <span class="model-opt-name">${mx.name}</span>
                                ${tagsHtml}
                            </div>`;
                        }).join('')}
                    </div>
                </div>`;
            }

        } else if (opt.type === 'ratio-res') {
            const ratio = sel[curType].ratio;
            const res   = sel[curType].res;
            const resLabel = res === '4K' ? '超清 4K' : res === '3K' ? '高清 3K' : res === '1K' ? '1K' : '高清 2K';
            const customRatios = sel[curType].customRatios || [];
            const ratioTab = sel[curType].ratioTab || '常用';
            const ps = sel[curType].platformSize;

            // Compute pill ratio icon
            let rw = 14, rh = 14;
            if (ratioTab !== '常用' && ps) {
                rw = ps.w; rh = ps.h;
            } else if (RATIO_SIZES[ratio]) {
                [rw, rh] = RATIO_SIZES[ratio];
            } else {
                const ratioNums = ratio.split(':').map(Number);
                if (ratioNums.length === 2 && ratioNums[1]) {
                    const mx = 16;
                    if (ratioNums[0] >= ratioNums[1]) { rw = mx; rh = Math.round(mx * ratioNums[1] / ratioNums[0]); }
                    else { rh = mx; rw = Math.round(mx * ratioNums[0] / ratioNums[1]); }
                }
            }
            const sc = 11 / Math.max(rw, rh);
            const iw = Math.round(rw * sc), ih = Math.round(rh * sc);

            let ratioText;
            if (ratioTab !== '常用' && ps) {
                ratioText = sel[curType].models.length > 1 ? `${ps.w}×${ps.h}` : `${ps.w}×${ps.h} · ${resLabel}`;
            } else {
                ratioText = sel[curType].models.length > 1 ? `${ratio}` : `${ratio} · ${resLabel}`;
            }
            pillVal = ratioPillIconHtml(iw, ih) + ratioText;

            // Platform tab bar
            const tabBar = `<div class="ratio-platform-tabs">
                ${PLATFORM_TABS.map(t =>
                    `<div class="ratio-platform-tab${t === ratioTab ? ' active' : ''}"
                          onclick="switchRatioTab(event,'${t}')">${t}</div>`
                ).join('')}
            </div>`;

            // Preset ratio content (swaps based on active tab)
            let presetContent;
            if (ratioTab === '常用') {
                presetContent = `<div class="ratio-row">
                    ${opt.ratioValues.map(v => {
                        const [w, h] = RATIO_SIZES[v] || [14, 14];
                        return `<div class="ratio-chip${v === ratio ? ' active' : ''}"
                                     onclick="pickRatioRes(event,'ratio','${v}')">
                            <div class="ratio-box" style="width:${w}px;height:${h}px;"></div>
                            <span class="ratio-lbl">${v}</span>
                        </div>`;
                    }).join('')}
                </div>`;
            } else {
                const presets = PLATFORM_PRESETS[ratioTab] || [];
                if (presets.length === 0) {
                    presetContent = `<div class="platform-empty">暂未配置，敬请期待</div>`;
                } else {
                    presetContent = `<div class="ratio-row" style="flex-wrap:nowrap;">
                        ${presets.map(p => {
                            const isActive = ps && ps.w === p.w && ps.h === p.h;
                            const mx = 16;
                            let cw = mx, ch = mx;
                            if (p.w >= p.h) { cw = mx; ch = Math.round(mx * p.h / p.w); }
                            else { ch = mx; cw = Math.round(mx * p.w / p.h); }
                            return `<div class="ratio-chip platform${isActive ? ' active' : ''}"
                                         onclick="pickPlatformPreset(event,${p.w},${p.h},'${p.ratio || ''}')">
                                <div class="platform-chip-icon">
                                    <div class="ratio-box" style="width:${cw}px;height:${ch}px;"></div>
                                </div>
                                <span class="ratio-lbl">${p.w}×${p.h}</span>
                                <span class="ratio-sub">${p.ratio || ''}</span>
                            </div>`;
                        }).join('')}
                    </div>`;
                }
            }

            // Build custom ratio chips
            const customChips = customRatios.map((cr, i) => {
                const parts = cr.split(':').map(Number);
                let cw = 14, ch = 14;
                if (parts.length === 2 && parts[1]) {
                    const mx = 16;
                    if (parts[0] >= parts[1]) { cw = mx; ch = Math.round(mx * parts[1] / parts[0]); }
                    else { ch = mx; cw = Math.round(mx * parts[0] / parts[1]); }
                }
                return `<div class="ratio-chip custom${cr===ratio?' active':''}"
                             onclick="pickRatioRes(event,'ratio','${cr}')">
                    <div class="chip-actions">
                        <span class="chip-action" onclick="editCustomRatio(event,${i})" title="编辑">✎</span>
                        <span class="chip-action" onclick="deleteCustomRatio(event,${i})" title="删除">✕</span>
                    </div>
                    <div class="ratio-box" style="width:${cw}px;height:${ch}px;"></div>
                    <span class="ratio-lbl">${cr}</span>
                </div>`;
            }).join('');

            const addBtn = customRatios.length < 5
                ? `<div class="custom-add-btn" onclick="showCustomInput(event)">+ 添加自定义比例</div>`
                : '';

            ddInner = `<div class="dd-section">
                <div class="dd-section-title">比例</div>
                ${tabBar}
                ${presetContent}
            </div>
            <div class="dd-section">
                <div class="dd-section-title">自定义比例</div>
                ${customRatios.length ? `<div class="ratio-row">${customChips}</div>` : ''}
                ${addBtn}
                <div class="custom-input-row" id="customInputRow" style="display:none;">
                    <input type="number" class="custom-input" id="customW" placeholder="宽"
                           min="1" max="9999" onclick="event.stopPropagation()" onkeydown="onCustomKey(event)">
                    <span class="custom-sep">:</span>
                    <input type="number" class="custom-input" id="customH" placeholder="高"
                           min="1" max="9999" onclick="event.stopPropagation()" onkeydown="onCustomKey(event)">
                    <button class="custom-confirm" onclick="saveCustomRatio(event)">✓</button>
                    <button class="custom-cancel" onclick="cancelCustomInput(event)">✕</button>
                </div>
            </div>
            ${opt.showRes !== false && sel[curType].models.length === 1 ? `<div class="dd-section">
                <div class="dd-section-title">质量</div>
                <div class="res-toggle">
                    ${(MODELS.find(x => x.id === sel[curType].models[0])?.qualities || [res]).map(v => `<div class="res-large${res===v?' active':''}" onclick="pickRatioRes(event,'res','${v}')">${v === '4K' ? '超清 4K <span class=\"res-star\">✦</span>' : v === '3K' ? '高清 3K' : v === '2K' ? '高清 2K' : v}</div>`).join('')}
                </div>
            </div>` : ''}`;

        } else if (opt.type === 'ratio-dur') {
            const ratio = sel[curType].ratio || '16:9';
            const ratioTab = sel[curType].ratioTab || '常用';
            const ps = sel[curType].platformSize;

            // pill 图标
            let rw = 14, rh = 14;
            if (ratioTab !== '常用' && ps) { rw = ps.w; rh = ps.h; }
            else if (RATIO_SIZES[ratio]) { [rw, rh] = RATIO_SIZES[ratio]; }
            const sc = 11 / Math.max(rw, rh);
            const iw = Math.round(rw * sc), ih = Math.round(rh * sc);
            const ratioDisplay = (ratioTab !== '常用' && ps) ? `${ps.w}×${ps.h}` : ratio;
            const dur = sel[curType].dur || '5秒';
            const ratioDurText = sel[curType].models.length > 1 ? `${ratioDisplay}` : `${ratioDisplay} · ${dur}`;
            pillVal = ratioPillIconHtml(iw, ih) + ratioDurText;

            // 平台 tab bar
            const tabBar = `<div class="ratio-platform-tabs">
                ${PLATFORM_TABS.map(t =>
                    `<div class="ratio-platform-tab${t === ratioTab ? ' active' : ''}"
                          onclick="switchRatioTab(event,'${t}')">${t}</div>`
                ).join('')}
            </div>`;

            // 预设比例内容
            let presetContent;
            if (ratioTab === '常用') {
                presetContent = `<div class="ratio-row">
                    ${opt.ratioValues.map(v => {
                        const [w, h] = RATIO_SIZES[v] || [14, 14];
                        return `<div class="ratio-chip${v === ratio ? ' active' : ''}"
                                     onclick="pickRatioRes(event,'ratio','${v}')">
                            <div class="ratio-box" style="width:${w}px;height:${h}px;"></div>
                            <span class="ratio-lbl">${v}</span>
                        </div>`;
                    }).join('')}
                </div>`;
            } else {
                const presets = PLATFORM_PRESETS[ratioTab] || [];
                if (presets.length === 0) {
                    presetContent = `<div class="platform-empty">暂未配置，敬请期待</div>`;
                } else {
                    presetContent = `<div class="ratio-row" style="flex-wrap:nowrap;">
                        ${presets.map(p => {
                            const isActive = ps && ps.w === p.w && ps.h === p.h;
                            const mx = 16;
                            let cw = mx, ch = mx;
                            if (p.w >= p.h) { cw = mx; ch = Math.round(mx * p.h / p.w); }
                            else { ch = mx; cw = Math.round(mx * p.w / p.h); }
                            return `<div class="ratio-chip platform${isActive ? ' active' : ''}"
                                         onclick="pickPlatformPreset(event,${p.w},${p.h},'${p.ratio || ''}')">
                                <div class="platform-chip-icon">
                                    <div class="ratio-box" style="width:${cw}px;height:${ch}px;"></div>
                                </div>
                                <span class="ratio-lbl">${p.w}×${p.h}</span>
                                <span class="ratio-sub">${p.ratio || ''}</span>
                            </div>`;
                        }).join('')}
                    </div>`;
                }
            }

            ddInner = `<div class="dd-section">
                <div class="dd-section-title">比例</div>
                ${tabBar}
                ${presetContent}
            </div>
            ${sel[curType].models.length === 1 ? `<div class="dd-section">
                <div class="dd-section-title">时长</div>
                <div class="dd-chips">
                    ${(VIDEO_MODELS.find(x => x.id === sel[curType].models[0])?.durations || [dur]).map(v =>
                        `<span class="dd-chip${v===dur?' active':''}"
                               onclick="pickDur(event,'${v}')">${v}</span>`
                    ).join('')}
                </div>
            </div>` : ''}`;

        } else if (opt.type === 'ratio') {
            const val = sel[curType][opt.key] || opt.def;
            const [rw, rh] = RATIO_SIZES[val] || [14, 14];
            const sc = 11 / Math.max(rw, rh);
            const iw = Math.round(rw * sc), ih = Math.round(rh * sc);
            pillVal = `<span class="pill-ratio-box" style="width:${iw}px;height:${ih}px;"></span>${val}`;
            ddInner = `<div class="dd-section">
                <div class="dd-section-title">${opt.label}</div>
                <div class="ratio-row">
                    ${opt.values.map(v => {
                        const [w,h] = RATIO_SIZES[v] || [14,14];
                        return `<div class="ratio-chip${v===val?' active':''}"
                                     onclick="pickOpt(event,'${opt.key}','${v}')">
                            <div class="ratio-box" style="width:${w}px;height:${h}px;"></div>
                            <span class="ratio-lbl">${v}</span>
                        </div>`;
                    }).join('')}
                </div>
            </div>`;

        } else if (opt.type === 'chips') {
            const val = sel[curType][opt.key] || opt.def;
            pillVal = val;
            ddInner = `<div class="dd-section">
                <div class="dd-section-title">${opt.label}</div>
                <div class="dd-chips">
                    ${opt.values.map(v =>
                        `<span class="dd-chip${v===val?' active':''}"
                               onclick="pickOpt(event,'${opt.key}','${v}')">${v}</span>`
                    ).join('')}
                </div>
            </div>`;

        } else if (opt.type === 'res') {
            const val = sel[curType][opt.key] || opt.def;
            pillVal = val;
            ddInner = `<div class="dd-section">
                <div class="dd-section-title">${opt.label}</div>
                <div class="dd-chips">
                    ${opt.values.map(v =>
                        `<span class="dd-chip${v===val?' active':''}"
                               onclick="pickOpt(event,'${opt.key}','${v}')">${v}</span>`
                    ).join('')}
                </div>
            </div>`;

        } else if (opt.type === 'count') {
            const val = sel[curType].count || '1';
            const unit = opt.unit || '张';
            const isCustom = !opt.values.includes(val);
            pillVal = val + ' ' + unit;
            ddInner = `<div class="dd-section">
                <div class="dd-section-title">生成数量</div>
                <div class="dd-chips" style="flex-wrap:nowrap;">
                    ${opt.values.map(v =>
                        `<span class="dd-chip${v===val?' active':''}"
                               onclick="pickOpt(event,'count','${v}')">${v}</span>`
                    ).join('')}
                    <span class="count-custom-wrap">
                        <input class="count-custom-input${isCustom?' active':''}"
                               id="countCustomInput"
                               type="number" min="1" max="99"
                               value="${isCustom ? val : ''}"
                               placeholder="自定义"
                               onclick="event.stopPropagation()"
                               onkeydown="onCountKey(event)">
                        <button class="count-confirm-btn" onclick="confirmCount(event)">确认</button>
                    </span>
                </div>
            </div>`;

        } else if (opt.type === 'project') {
            const val = sel[curType].project || '';
            pillVal = val || '项目';
            ddInner = null;

        } else if (opt.type === 'toggle') {
            const on = !!sel[curType][opt.key];
            const iconThink = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>`;
            const iconSearch = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`;
            const icon = opt.key === 'think' ? iconThink : iconSearch;
            pillVal = `${icon} ${opt.label}`;
            if (on) pill.classList.add('on');
            pill.classList.add('toggle-pill');
            ddInner = null;

        } else if (opt.type === 'upload-btn') {
            const icon = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`;
            pillVal = `${icon} ${opt.label}`;
            pill.classList.add('toggle-pill');
            ddInner = null;

        } else {
            const val = sel[curType][opt.key];
            pillVal = val;
            ddInner = `<div class="dd-section">
                <div class="dd-section-title">${opt.label}</div>
                <div class="dd-chips">
                    ${opt.values.map(v =>
                        `<span class="dd-chip${v===val?' active':''}"
                               onclick="pickOpt(event,'${opt.key}','${v}')">${v}</span>`
                    ).join('')}
                </div>
            </div>`;
        }

        if (opt.type === 'project') {
            pill.title = '选择您的目标产品或品类（多选），生成内容将结合这些产品特点进行优化';
        }

        const hasProject = Array.isArray(sel[curType].project) ? sel[curType].project.length > 0 : !!sel[curType].project;
        const clearBtn = (opt.type === 'project' && hasProject)
            ? `<button class="pill-clear" onclick="event.stopPropagation();onProjectConfirm('')">✕</button>` : '';
        const decoratedPillVal = (opt.type === 'toggle' || opt.type === 'upload-btn' || hasInlinePillIcon(opt))
            ? pillVal
            : withOptionIcon(opt, pillVal);

        if (ddInner === null) {
            if (opt.type === 'project') {
                // project pill：无下拉，有清除按钮
                pill.innerHTML = `<span class="opt-pill-val">${decoratedPillVal}</span>${clearBtn}`;
            } else {
                // toggle pill — no dropdown, no arrow
                pill.innerHTML = `<span class="opt-pill-val">${decoratedPillVal}</span>`;
            }
        } else {
            pill.innerHTML = `
                <span class="opt-pill-val">${decoratedPillVal}</span>${clearBtn}
                <span class="arr">▾</span>
                <div class="opt-dd" id="dd-${opt.key}">${ddInner}</div>`;
        }

        pill.addEventListener('click', e => {
            e.stopPropagation();
            if (opt.type === 'toggle') {
                sel[curType][opt.key] = !sel[curType][opt.key];
                renderOpts();
                return;
            }
            if (opt.type === 'upload-btn') {
                setTimeout(() => document.getElementById('chatFileInput').click(), 0);
                return;
            }
            if (opt.type === 'project') {
                openProjModal();
                return;
            }
            const dd = pill.querySelector('.opt-dd');
            const isOpen = pill.classList.contains('open');
            closeAll();
            if (!isOpen) { pill.classList.add('open'); dd.classList.add('show'); }
        });

        area.appendChild(pill);
    });
}

function filterModels(e) {
    const q = e.target.value.toLowerCase().trim();
    const rows = e.target.closest('.dd-section').querySelectorAll('.model-opt-row');
    rows.forEach(r => {
        const name = (r.querySelector('.model-opt-name').textContent || '').toLowerCase();
        if (!q || name.includes(q)) {
            r.style.display = '';
        } else {
            r.style.display = 'none';
        }
    });
}

function confirmCount(e) {
    e.stopPropagation();
    const input = document.getElementById('countCustomInput');
    const v = parseInt(input?.value);
    if (!v || v < 1) return;
    sel[curType].count = String(Math.min(99, v));
    closeAll();
    renderOpts();
}

function onCountKey(e) {
    if (e.key === 'Enter') confirmCount(e);
}

function onCountInput(e) {
    const v = parseInt(e.target.value);
    if (!v || v < 1) return;
    sel[curType].count = String(Math.min(99, v));
    const pill = document.getElementById('pill-count');
    const unit = curType === 'video' ? '个' : curType === 'chat' ? '条' : '张';
    if (pill) pill.querySelector('.opt-pill-val').textContent = `${sel[curType].count} ${unit}`;
}

function pickOpt(e, key, val) {
    e.stopPropagation();
    sel[curType][key] = val;
    closeAll();
    renderOpts();
    if (curType === 'video' && key === 'mode') renderKeyframeStrip();
}

function getModelList(type = curType) {
    return type === 'video' ? VIDEO_MODELS : type === 'chat' ? CHAT_MODELS : MODELS;
}

function getModelMeta(type, modelId) {
    return getModelList(type).find(item => item.id === modelId);
}

function getDefaultModelParam(type, modelId) {
    const meta = getModelMeta(type, modelId);
    if (!meta) return type === 'video' ? '5秒' : '2K';
    return type === 'video' ? (meta.durations?.[0] || '5秒') : (meta.qualities?.[0] || '2K');
}

function syncSingleModelState(type = curType, modelId) {
    if (!modelId) return;
    const state = sel[type];
    state.count = state.modelCounts[modelId] || state.count || '1';
    if (type === 'image') {
        state.res = state.modelQuality[modelId] || getDefaultModelParam(type, modelId);
        updateSize(state.ratio, state.res);
        state.modelQuality = {};
    } else if (type === 'video') {
        state.dur = state.modelDuration[modelId] || getDefaultModelParam(type, modelId);
        state.modelDuration = {};
    }
    state.modelCounts = {};
}

function ensureModelState(type, modelId) {
    const state = sel[type];
    if (!state.modelCounts[modelId]) state.modelCounts[modelId] = state.count || '1';
    if (type === 'image') {
        const meta = getModelMeta(type, modelId);
        const fallback = meta?.qualities?.includes(state.res) ? state.res : getDefaultModelParam(type, modelId);
        if (!state.modelQuality[modelId]) state.modelQuality[modelId] = fallback;
    } else if (type === 'video') {
        const meta = getModelMeta(type, modelId);
        const fallback = meta?.durations?.includes(state.dur) ? state.dur : getDefaultModelParam(type, modelId);
        if (!state.modelDuration[modelId]) state.modelDuration[modelId] = fallback;
    }
}

function toggleModel(e, modelId) {
    e.stopPropagation();
    const state = sel[curType];
    const ms = state.models;
    const idx = ms.indexOf(modelId);
    if (idx >= 0) {
        if (ms.length <= 1) return;
        ms.splice(idx, 1);
        delete state.modelCounts[modelId];
        if (curType === 'image') delete state.modelQuality[modelId];
        if (curType === 'video') delete state.modelDuration[modelId];
        if (ms.length === 1) {
            syncSingleModelState(curType, ms[0]);
        }
    } else {
        ms.push(modelId);
        if (ms.length === 2) {
            ms.forEach(id => ensureModelState(curType, id));
        } else {
            ensureModelState(curType, modelId);
        }
    }
    reopenModelPanel();
}

function setModelCount(e, modelId) {
    e.stopPropagation();
    const v = parseInt(e.target.value);
    if (v && v >= 1) {
        sel[curType].modelCounts[modelId] = String(Math.min(99, v));
    }
}

function setModelParam(e, modelId, kind) {
    e.stopPropagation();
    const value = e.target.value;
    if (curType === 'image' && kind === 'quality') {
        sel.image.modelQuality[modelId] = value;
        if (sel.image.models.length === 1) {
            sel.image.res = value;
            updateSize(sel.image.ratio, value);
        }
    }
    if (curType === 'video' && kind === 'duration') {
        sel.video.modelDuration[modelId] = value;
        if (sel.video.models.length === 1) {
            sel.video.dur = value;
        }
    }
    reopenModelPanel();
}

function reopenModelPanel() {
    renderOpts();
    const pill = document.getElementById('pill-model');
    const dd = document.getElementById('dd-model');
    if (pill && dd) { pill.classList.add('open'); dd.classList.add('show'); }
}

const _projectOpen = new Set();

function pickDur(e, val) {
    e.stopPropagation();
    sel[curType].dur = val;
    if (sel[curType].models.length === 1) {
        const mid = sel[curType].models[0];
        sel[curType].modelDuration[mid] = val;
    }
    reopenRatioPanel();
}

function pickRatioRes(e, type, val) {
    e.stopPropagation();
    if (type === 'ratio') {
        sel[curType].ratio = val;
        sel[curType].platformSize = null;
    } else {
        sel[curType].res = val;
        if (sel[curType].models.length === 1) {
            const mid = sel[curType].models[0];
            sel[curType].modelQuality[mid] = val;
        }
    }
    updateSize(sel[curType].ratio, sel[curType].res);
    reopenRatioPanel();
}

function switchRatioTab(e, tab) {
    e.stopPropagation();
    sel[curType].ratioTab = tab;
    sel[curType].platformSize = null; // 切换平台时清空当前选中尺寸
    reopenRatioPanel();
}

function pickPlatformPreset(e, w, h, ratio) {
    e.stopPropagation();
    sel[curType].platformSize = { w, h, ratio: ratio || null };
    sel[curType].sizeW = w;
    sel[curType].sizeH = h;
    if (ratio) sel[curType].ratio = ratio;
    reopenRatioPanel();
}

let editingCustomIndex = -1;

function showCustomInput(e) {
    e.stopPropagation();
    editingCustomIndex = -1;
    const row = document.getElementById('customInputRow');
    if (row) {
        row.style.display = 'flex';
        const wInput = document.getElementById('customW');
        const hInput = document.getElementById('customH');
        wInput.value = ''; hInput.value = '';
        wInput.focus();
    }
}

function cancelCustomInput(e) {
    e.stopPropagation();
    editingCustomIndex = -1;
    const row = document.getElementById('customInputRow');
    if (row) row.style.display = 'none';
}

function saveCustomRatio(e) {
    e.stopPropagation();
    const w = parseInt(document.getElementById('customW')?.value);
    const h = parseInt(document.getElementById('customH')?.value);
    if (!w || !h || w < 1 || h < 1) { showToast('请输入有效的宽高值'); return; }
    const ratio = `${w}:${h}`;
    const customs = sel[curType].customRatios || [];
    if (editingCustomIndex >= 0) {
        customs[editingCustomIndex] = ratio;
    } else {
        if (customs.length >= 5) { showToast('最多添加 5 个自定义比例'); return; }
        customs.push(ratio);
    }
    sel[curType].customRatios = customs;
    editingCustomIndex = -1;
    sel[curType].ratio = ratio;
    updateSize(ratio, sel[curType].res);
    reopenRatioPanel();
}

function editCustomRatio(e, index) {
    e.stopPropagation();
    const customs = sel[curType].customRatios || [];
    const parts = customs[index].split(':').map(Number);
    editingCustomIndex = index;
    const row = document.getElementById('customInputRow');
    if (row) {
        row.style.display = 'flex';
        document.getElementById('customW').value = parts[0] || '';
        document.getElementById('customH').value = parts[1] || '';
        document.getElementById('customW').focus();
    }
}

function deleteCustomRatio(e, index) {
    e.stopPropagation();
    const customs = sel[curType].customRatios || [];
    const removed = customs.splice(index, 1)[0];
    if (sel[curType].ratio === removed) {
        sel[curType].ratio = '1:1';
        updateSize('1:1', sel[curType].res);
    }
    reopenRatioPanel();
}

function onCustomKey(e) {
    if (e.key === 'Enter') { saveCustomRatio(e); }
    else if (e.key === 'Escape') { cancelCustomInput(e); }
}

function reopenRatioPanel() {
    renderOpts();
    const pill = document.getElementById('pill-ratio-dur') || document.getElementById('pill-ratio-res');
    const dd   = document.getElementById('dd-ratio-dur')   || document.getElementById('dd-ratio-res');
    if (pill && dd) { pill.classList.add('open'); dd.classList.add('show'); }
}

function openHistory() {
    parent.postMessage({ action: 'openTab', title: '我的任务', url: 'AI 创作/我的任务.html' }, '*');
}

// ── 工作流渲染逻辑 ──
const WF_LABELS = { chat: '文案', image: '图像', video: '视频' };
const MOCK_WFS = { chat: [], image: [], video: [] };
const HIDDEN_SQUARE_FAVORITES = new Set();

// 生成模拟数据：收藏5，我的15，广场数据仅用于跳转页；交互只改运行时状态，刷新后恢复演示数据。
['chat', 'image', 'video'].forEach(type => {
    for(let i=1; i<=40; i++) {
        MOCK_WFS[type].push({
            id: `wf-${type}-${i}`,
            name: i === 1 ? `爆款${WF_LABELS[type]}裂变工作流` : `${WF_LABELS[type]}生产流 ${i}`,
            desc: `用于${WF_LABELS[type]}素材的高效自动化处理，支持多种参数调节与质量优化。`,
            author: '张三',
            date: '2025-02-12',
            type: WF_LABELS[type],
            visibility: i > 5 && i <= 20 ? 'private' : 'public',
            isPinned: i <= 5,
            isMine: i > 5 && i <= 20
        });
    }
});

function getWorkflowById(id) {
    for (const type of Object.keys(MOCK_WFS)) {
        const found = MOCK_WFS[type].find(w => w.id === id);
        if (found) return found;
    }
    return null;
}

function getWorkflowVisibilityLabel(w) {
    return w && (w.visibility === 'private' || w.isMine) ? '仅自己可见' : '全部可见';
}

function renderWorkflows() {
    const list = MOCK_WFS[curType] || [];
    const squareFavorites = getSquareFavoriteWorkflows(curType);
    const pinned = [...squareFavorites, ...list.filter(w => w.isPinned)];
    const mine = list.filter(w => w.isMine);

    const getWfIcon = (type) => TYPE_ICONS[type] || TYPE_ICONS.image;

    const renderGrid = (containerId, data, options = {}) => {
        const grid = document.getElementById(containerId);
        if (!grid) return;
        if (!data || data.length === 0) {
            grid.innerHTML = options.emptyHtml || '';
            return;
        }

        let html = data.map(w => {
            const menuHtml = w.isMine
                ? `
                    <div class="wf-menu-item" onclick="event.stopPropagation();openWorkflowEditChoice('${w.id}')">编辑</div>
                    <div class="wf-menu-item" onclick="event.stopPropagation();closeAllMenus();showToast('副本已创建')">创建副本</div>
                    <div class="wf-menu-item danger" onclick="event.stopPropagation();deleteWorkflow('${w.id}')">删除</div>
                `
                : `
                    <div class="wf-menu-item" onclick="event.stopPropagation();closeAllMenus();showToast('副本已创建')">创建副本</div>
                `;
            return `
            <div class="wf-card" onclick="useWorkflow('${curType}')">
                <button class="wf-detail-btn" type="button" onclick="event.stopPropagation();parent.postMessage({ action: 'openTab', title: '工作流详情', url: 'AI 创作/工作流编辑器.html?id=${w.id}' }, '*')">详 &gt;</button>
                <div class="wf-card-actions">
                    <button class="wf-favorite-trigger${w.isPinned ? ' active' : ''}" type="button" title="${w.isPinned ? '取消收藏' : '收藏'}" aria-label="${w.isPinned ? '取消收藏' : '收藏'}" onclick="event.stopPropagation();toggleWorkflowFavorite('${w.id}')">${w.isPinned ? '★' : '☆'}</button>
                    <button class="wf-more-trigger" type="button" title="更多操作" aria-label="更多操作" onclick="toggleWfMenu(event, this)">...</button>
                </div>
                <div class="wf-card-main">
                    <div class="wf-icon-box">${getWfIcon(curType)}</div>
                    <div class="wf-info">
                        <div class="wf-head">
                            <div class="wf-name">${w.name}</div>
                            <div class="wf-stats"></div>
                        </div>
                    </div>
                </div>
                <div class="wf-desc-text">${w.desc}</div>
                <div class="wf-card-footer">
                    <span class="wf-meta">${w.date || '刚刚'} · ${getWorkflowVisibilityLabel(w)}</span>
                </div>
                <div class="wf-menu">${menuHtml}</div>
            </div>
        `;
        }).join('');

        grid.innerHTML = html;
    };

    const pinnedSection = document.getElementById('sectionPinned');
    if (pinnedSection) pinnedSection.style.display = pinned.length ? '' : 'none';

    renderGrid('wfPinned', pinned);
    renderGrid('wfMine', mine, {
        emptyHtml: `
            <div class="wf-empty-state">
                <div class="wf-empty-title">暂无${WF_LABELS[curType]}工作流</div>
                <div class="wf-empty-desc">可以新建一个工作流，或去工作流广场收藏可复用的生产流程。</div>
                <button class="wf-empty-create" onclick="event.stopPropagation();openCreateModal()">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    新建工作流
                </button>
            </div>
        `
    });
}

function openWorkflowEditorTab(id, mode) {
    const params = new URLSearchParams();
    if (id) params.set('id', id);
    if (mode === 'draft') {
        params.set('draft', '1');
    } else if (mode === 'published') {
        params.set('mode', 'published');
    }
    parent.postMessage({
        action: 'openTab',
        title: '编辑工作流',
        url: 'AI 创作/工作流编辑器.html' + (params.toString() ? '?' + params.toString() : '')
    }, '*');
}

function openWorkflowEditChoice(id) {
    closeAllMenus();
    openConfirmModal({
        title: '是否继续上次编辑？',
        description: '继续将进入上次自动保存的编辑状态；放弃将进入当前已发布的工作流状态。',
        cancelText: '放弃',
        confirmText: '继续',
        onConfirm: function () {
            openWorkflowEditorTab(id, 'draft');
        },
        onCancel: function () {
            try { localStorage.removeItem('has_workflow_draft'); } catch(e) {}
            openWorkflowEditorTab(id, 'published');
        }
    });
}

function getSquareFavoriteWorkflows(type) {
    try {
        const typeMap = { copy: 'chat', image: 'image', video: 'video' };
        const raw = JSON.parse(localStorage.getItem('workflow_favorite_items') || '[]');
        return raw
            .filter(item => typeMap[item.type] === type)
            .filter(item => !HIDDEN_SQUARE_FAVORITES.has(item.id))
            .map(item => ({
                id: item.id,
                name: item.name,
                desc: item.desc,
                author: item.creator || item.sourceName || '工作流广场',
                creator: item.creator || item.sourceName || '工作流广场',
                date: item.updated || item.createdAt || '',
                updated: item.updated || item.createdAt || '',
                createdAt: item.createdAt || item.updated || '',
                type: item.type,
                typeName: item.typeName || WF_LABELS[type],
                source: item.source || 'official',
                sourceName: item.sourceName || '工作流广场',
                uses: item.uses || 0,
                favorites: item.favorites || 0,
                visibility: item.visibility || 'public',
                isSquareFavorite: true,
                isPinned: true,
                isMine: false
            }));
    } catch (err) {
        return [];
    }
}

function toggleWorkflowFavorite(id) {
    closeAllMenus();
    const wf = getWorkflowById(id);
    if (!wf) {
        removeSquareFavoriteWorkflow(id);
        showToast('取消收藏成功');
        renderWorkflows();
        return;
    }
    wf.isPinned = !wf.isPinned;
    showToast(wf.isPinned ? '收藏成功' : '取消收藏成功');
    renderWorkflows();
}

function removeSquareFavoriteWorkflow(id) {
    HIDDEN_SQUARE_FAVORITES.add(id);
}

function deleteWorkflow(id) {
    closeAllMenus();
    openConfirmModal({
        title: '提示',
        description: '是否删除该工作流？正在进行的任务不会受到影响。',
        cancelText: '取消',
        confirmText: '确认',
        onConfirm: function () {
            const wf = getWorkflowById(id);
            if (!wf) {
                removeSquareFavoriteWorkflow(id);
                showToast('已删除');
                renderWorkflows();
                return;
            }
            const typeList = MOCK_WFS[wf.id.split('-')[1]];
            if (!typeList) return;
            const index = typeList.findIndex(item => item.id === id);
            if (index > -1) typeList.splice(index, 1);
            showToast('已删除');
            renderWorkflows();
        }
    });
}

function toggleWfMenu(e, btn) {
    e.stopPropagation();
    const card = btn.closest('.wf-card');
    const menu = card ? card.querySelector('.wf-menu') : null;
    if (!menu) return;
    const isShow = menu.classList.contains('show');
    closeAllMenus();
    if (!isShow) menu.classList.add('show');
}

function closeAllMenus() {
    document.querySelectorAll('.wf-menu.show').forEach(m => m.classList.remove('show'));
}

document.addEventListener('click', closeAllMenus);

function switchType(btn) {
    const type = btn.dataset.type;
    curType = type;

    // 同步所有 type-btn 状态
    document.querySelectorAll('.type-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.type === type);
    });

    const isChat = curType === 'chat';

    // 上传区 & 参考图条
    if (!document.getElementById('refAddBtn')) {
        document.getElementById('uploadBlock').style.display = '';
    }
    document.getElementById('chatAttachBtn').style.display = 'none';
    if (!isChat) {
        chatAttachments = [];
        document.getElementById('chatAttachStrip').style.display = 'none';
        document.getElementById('chatAttachStrip').innerHTML = '';
    }
    renderKeyframeStrip();

    // 选项区 vs 对话工具
    document.getElementById('optArea').style.display = 'flex';
    document.getElementById('chatExtra').style.display = 'none';
    syncToolboxParseState();
    syncToolboxFormatState();

    // 发送/生成按钮外观
    const genBtn = document.getElementById('genBtn');
    genBtn.classList.remove('send-mode');
    setGenerateButtonLabel();

    // placeholder
    const ph = { chat: '尝试描述你想要的文案内容，或上传图片让 AI 识图写文', image: '尝试描述您想要创建的图像', video: '尝试描述您想要创建的视频' };
    setPromptPlaceholder(ph[curType] || '');

    // dynamic workflow title
    const wfTitles = { chat: '文案工作流', image: '图像工作流', video: '视频工作流' };
    const wfMainTitle = document.getElementById('wfMainTitle');
    if (wfMainTitle) wfMainTitle.textContent = wfTitles[curType] || '工作流';

    closeAll();
    renderOpts();
    renderWorkflows();
}

function useWorkflow(type) {
    if (type === 'image') {
        parent.postMessage({ action: 'openTab', title: '工作流-裂变', url: 'AI 创作/工作流-裂变.html?from=通用生成' }, '*');
        return;
    }
    const btn = document.querySelector(`.type-btn[data-type="${type}"]`);
    if (btn) switchType(btn);
    focusPromptInput();
}

function doGenerate() {
    const txt = getPromptText();
    if (!txt) { focusPromptInput(); return; }
    if (document.getElementById('genBtn').classList.contains('loading')) return;
    localStorage.setItem('pendingGen', JSON.stringify({
        type: curType,
        prompt: txt,
        opts: sel[curType] ? JSON.parse(JSON.stringify(sel[curType])) : {}
    }));
    showNotif();
    parent.postMessage({ action: 'openTab', title: '我的任务', url: 'AI 创作/我的任务.html' }, '*');
}

function closeAll(e) {
    if (e) {
        const toolboxWrap = document.getElementById('toolboxWrap');
        if (toolboxWrap && toolboxWrap.contains(e.target)) return;
    }
    document.querySelectorAll('.opt-pill.open').forEach(p => p.classList.remove('open'));
    document.querySelectorAll('.opt-dd.show').forEach(d => d.classList.remove('show'));
    unpinToolboxPanel();
}

let _tt;
function showToast(msg, type) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.toggle('error', type === 'error');
    el.classList.toggle('ghost', type === 'ghost');
    el.classList.add('show');
    clearTimeout(_tt);
    _tt = setTimeout(() => el.classList.remove('show'), 2400);
}

let _nt;
function showNotif() {
    const el = document.getElementById('notif');
    el.classList.add('show');
    clearTimeout(_nt);
    _nt = setTimeout(() => el.classList.remove('show'), 4000);
}
function hideNotif() {
    clearTimeout(_nt);
    document.getElementById('notif').classList.remove('show');
}

document.addEventListener('click', closeAll);

updateSize(sel.image.ratio, sel.image.res);
initPromptMediaInput();
renderTypeIcons();
renderOpts();
setGenerateButtonLabel();
renderWorkflows();
onInput();
syncToolboxParseState();
syncToolboxFormatState();
</script>

      <input id="ccProjSearchInput" placeholder="搜索品类或产品..." oninput="renderProjModalBody()">
    </div>

<script>
var PROJECT_TREE = PROJECTS.map(function(g) { return { name: g.category, children: g.products }; });

}

    getValue: function() { return sel[curType].project || ''; },
