<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实时任务查询 - 量化投放系统</title>
  <style>
    :root { --blue:#4a9eff; --blue-dark:#287ee0; --blue-soft:#edf6ff; --bg:#f5f7fa; --card:#fff; --text:#333; --sub:#8c8c8c; --line:#e8e8e8; --green:#52c41a; --red:#f5222d; --orange:#fa8c16; --gray:#bfbfbf; }
    *{box-sizing:border-box} body{margin:0;padding:8px;background:var(--bg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)} button,input,select{font:inherit} button{cursor:pointer}
    .page{min-height:calc(100vh - 16px);display:flex;flex-direction:column;gap:8px}.page-title{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 20px}.page-title h1{margin:0;font-size:18px;font-weight:600}.page-title p{margin:4px 0 0;color:#8c8c8c;font-size:12px}.live{display:flex;align-items:center;gap:7px;color:#52c41a;font-size:12px}.live i{width:7px;height:7px;border-radius:50%;background:#52c41a;box-shadow:0 0 0 4px #f6ffed}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.03)}.filter-panel{padding:18px 20px}.filters{display:grid;grid-template-columns:1.45fr 1fr 1fr 1fr;gap:16px 20px}.field label{display:block;margin-bottom:7px;color:#595959;font-size:13px}.field input,.field select{width:100%;height:32px;padding:0 10px;border:1px solid #d9d9d9;border-radius:6px;outline:0;background:#fff;color:#333}.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(74,158,255,.14)}.field input::placeholder{color:#bfbfbf}.filter-footer{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid #f0f0f0}.metrics{display:flex;align-items:center}.metric{display:flex;flex-direction:column;min-width:132px;padding:0 20px;border-left:1px solid #f0f0f0}.metric:first-child{padding-left:0;border:0}.metric span{font-size:12px;color:#8c8c8c}.metric b{font-size:20px;margin-top:2px}.actions{display:flex;gap:8px}.btn{height:32px;padding:0 15px;border:1px solid #d9d9d9;border-radius:6px;color:#595959;background:#fff}.btn:hover{border-color:var(--blue);color:var(--blue)}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue-dark);color:#fff}
    .table-panel{overflow:hidden;flex:1}.table-head{height:56px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.table-head h2{font-size:15px;margin:0;font-weight:600}.table-head small{margin-left:7px;color:#8c8c8c;font-weight:400}.export{border:0;background:transparent;color:var(--blue);display:flex;gap:5px;align-items:center}.export:hover{color:var(--blue-dark)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1110px}th,td{text-align:left;border-bottom:1px solid #f0f0f0;padding:0 16px}th{height:42px;background:#fafafa;color:#595959;font-size:13px;font-weight:500;white-space:nowrap}td{height:58px;color:#434343;white-space:nowrap}tbody tr:hover{background:#fafcff}.mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#6b7280}.tag{display:inline-flex;height:22px;align-items:center;padding:0 7px;border-radius:4px;font-size:12px}.video{color:#287ee0;background:#e6f4ff}.image{color:#389e0d;background:#f6ffed}.text{color:#d46b08;background:#fff7e6}.status{display:inline-flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}.failed{background:var(--red)}.interrupted{background:var(--gray)}.running{background:var(--orange)}.zero{color:#f5222d}.work-sub{display:block;margin-top:2px;font-size:11px;color:#b0b0b0}.link{border:0;background:transparent;color:var(--blue);padding:0}.link:hover{color:var(--blue-dark)}.pagination{height:56px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;color:#8c8c8c;font-size:12px}.pages{display:flex;gap:6px}.page-btn{width:28px;height:28px;border:1px solid #d9d9d9;border-radius:5px;background:#fff;color:#595959}.page-btn.active{border-color:var(--blue);color:var(--blue)}.page-btn:disabled{color:#d9d9d9;cursor:not-allowed}
    .mask{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:.18s;z-index:10}.drawer{position:fixed;top:0;right:0;bottom:0;width:580px;max-width:100%;background:#fff;box-shadow:-4px 0 16px rgba(0,0,0,.12);transform:translateX(100%);transition:.18s;z-index:11;overflow:auto}.mask.open{opacity:1;pointer-events:auto}.drawer.open{transform:translateX(0)}.drawer-head{height:56px;padding:0 20px;position:sticky;top:0;background:#fff;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;justify-content:space-between;z-index:1}.drawer-head h3{margin:0;font-size:16px}.close{border:0;background:transparent;font-size:24px;line-height:1;color:#8c8c8c}.drawer-body{padding:20px 24px 84px}.alert{padding:10px 12px;border-radius:6px;border:1px solid #ffccc7;background:#fff1f0;color:#cf1322;font-size:13px}.section{margin-top:20px}.section h4{margin:0 0 10px;font-size:14px}.detail{margin:0;border:1px solid #f0f0f0;border-radius:6px;overflow:hidden}.row{display:grid;grid-template-columns:138px 1fr;min-height:40px;border-bottom:1px solid #f0f0f0}.row:last-child{border:0}.row dt{margin:0;padding:10px 12px;background:#fafafa;color:#8c8c8c}.row dd{margin:0;padding:10px 12px;word-break:break-all}.timeline{margin-left:5px;padding-left:17px;border-left:2px solid #e8e8e8}.event{position:relative;padding:0 0 17px 10px;color:#8c8c8c;font-size:13px}.event:last-child{padding-bottom:0}.event:before{content:"";position:absolute;left:-22px;top:5px;width:8px;height:8px;background:#52c41a;border-radius:50%}.event b{display:block;color:#434343;font-weight:500}.drawer-foot{height:64px;position:fixed;right:0;bottom:0;width:580px;max-width:100%;padding:16px 20px;background:#fff;border-top:1px solid #e8e8e8;display:flex;justify-content:flex-end;gap:8px}
    @media(max-width:1000px){.filters{grid-template-columns:repeat(2,1fr)}}@media(max-width:640px){body{padding:4px}.filters{grid-template-columns:1fr}.filter-footer{align-items:flex-start;flex-direction:column;gap:16px}.metrics{width:100%;justify-content:space-between}.metric{min-width:0;padding:0 10px}.metric:first-child{padding-left:0}.page-title{align-items:flex-start}.live{padding-top:5px}}
  </style>
</head>
<body>
<main class="page">
  <section class="page-title"><div><h1>实时任务查询</h1><p>查询全量任务运行情况，定位异常并支持回填。</p></div><span class="live"><i></i>实时数据</span></section>
  <section class="panel filter-panel"><div class="filters">
    <div class="field"><label>任务开始时间</label><input id="start" type="date" value="2026-08-24"></div><div class="field"><label>任务结束时间</label><input id="end" type="date" value="2026-08-29"></div>
    <div class="field"><label>用户</label><input id="user" list="userList" placeholder="请选择或搜索用户"><datalist id="userList"><option value="张竣"><option value="胡慧"><option value="陈英豪"><option value="李炎蔚"><option value="杨雪婷"><option value="谈盼盼"></datalist></div><div class="field"><label>任务 ID</label><input id="taskId" placeholder="请输入任务 ID"></div>
    <div class="field"><label>工作流 ID</label><input id="workflowId" placeholder="请输入工作流 ID"></div><div class="field"><label>任务类型</label><select id="kind"><option value="">全部</option><option>通用生成</option><option>工作流</option></select></div><div class="field"><label>生成类型</label><select id="type"><option value="">全部</option><option>视频</option><option>图片</option><option>文案</option></select></div><div class="field"><label>任务状态</label><select id="status"><option value="">全部</option><option value="success">成功</option><option value="failed">失败</option><option value="interrupted">已中断</option><option value="running">运行中</option></select></div>
  </div><div class="filter-footer"><div class="metrics"><div class="metric"><span>任务总数</span><b id="total">0</b></div><div class="metric"><span>运行中</span><b id="runningNum">0</b></div><div class="metric"><span>异常任务</span><b id="abnormal">0</b></div><div class="metric"><span>输出素材总数</span><b id="outputs">0</b></div></div><div class="actions"><button class="btn" id="reset">重置</button><button class="btn primary" id="search">查询</button></div></div></section>
  <section class="panel table-panel"><div class="table-head"><h2>实时任务清单 <small id="result">共 0 条</small></h2><button class="export" id="export">⇩ 导出当前结果</button></div><div class="table-wrap"><table><thead><tr><th>任务开始时间</th><th>任务 ID</th><th>生成类型</th><th>任务类型</th><th>用户</th><th>工作流名称 / ID</th><th>任务状态</th><th>输出素材数量</th><th>运行时长</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div><div class="pagination"><span id="range"></span><div class="pages"><button class="page-btn" id="previous">‹</button><button class="page-btn active">1</button><button class="page-btn" id="next">›</button></div></div></section>
</main>
<div class="mask" id="mask"></div><aside class="drawer" id="drawer"><header class="drawer-head"><h3>任务详情</h3><button class="close" id="close">×</button></header><div class="drawer-body" id="detail"></div><footer class="drawer-foot"><button class="btn" id="copy">复制任务信息</button><button class="btn primary" id="retry">回填任务</button></footer></aside>
<script>
const tasks=[
{time:'2026-08-29 16:42:18',id:'T20260829-8F2A91',type:'视频',kind:'工作流',user:'张竣',workflow:'字幕关键词高亮',wid:'wf_9c7a12',status:'failed',output:0,duration:'00:02:14',error:'OCR 服务识别失败（ERR_OCR_FRAME）'},
{time:'2026-08-29 16:31:04',id:'T20260829-49E25D',type:'视频',kind:'工作流',user:'张竣',workflow:'视频去重',wid:'wf_1b46e8',status:'success',output:126,duration:'00:06:38'},
{time:'2026-08-29 15:28:56',id:'T20260829-D764BE',type:'视频',kind:'工作流',user:'胡慧',workflow:'素材合成',wid:'wf_47ef21',status:'success',output:180,duration:'00:18:45'},
{time:'2026-08-29 14:16:22',id:'T20260829-2AC4D7',type:'图片',kind:'通用生成',user:'陈英豪',workflow:'-',wid:'-',status:'success',output:4,duration:'00:01:09',vendor:'火山引擎',requestId:'req_01J2G9Y7M08',vendorTip:'请求处理成功'},
{time:'2026-08-29 13:57:11',id:'T20260829-1E8F62',type:'文案',kind:'工作流',user:'李炎蔚',workflow:'【单】15秒内真人剧情视频逆向脚本',wid:'wf_3b6d90',status:'interrupted',output:0,duration:'00:00:36',error:'用户手动终止'},
{time:'2026-08-28 18:42:09',id:'T20260828-A6C11F',type:'视频',kind:'工作流',user:'张竣',workflow:'素材拆分',wid:'wf_7e04c2',status:'success',output:96,duration:'00:12:51'},
{time:'2026-08-28 16:20:47',id:'T20260828-7DA08B',type:'图片',kind:'通用生成',user:'杨雪婷',workflow:'-',wid:'-',status:'success',output:8,duration:'00:01:47',vendor:'腾讯混元',requestId:'hunyuan-9d3a721c',vendorTip:'request accepted'},
{time:'2026-08-28 11:23:18',id:'T20260828-CA7F82',type:'文案',kind:'工作流',user:'张竣',workflow:'【批】15秒内真人剧情视频逆向脚本',wid:'wf_8d91fe',status:'success',output:12,duration:'00:03:22'},
{time:'2026-08-27 18:01:15',id:'T20260827-5B41F4',type:'视频',kind:'工作流',user:'张竣',workflow:'字幕关键词高亮',wid:'wf_9c7a12',status:'failed',output:0,duration:'00:02:02',error:'OCR 服务识别失败（ERR_OCR_FRAME）'},
{time:'2026-08-27 17:34:42',id:'T20260827-C8D350',type:'视频',kind:'通用生成',user:'谈盼盼',workflow:'-',wid:'-',status:'running',output:0,duration:'进行中',vendor:'即梦',requestId:'jimeng-70288fae',vendorTip:'任务正在排队'},
{time:'2026-08-26 10:08:34',id:'T20260826-35B1EE',type:'图片',kind:'通用生成',user:'陈英豪',workflow:'-',wid:'-',status:'success',output:6,duration:'00:02:15',vendor:'火山引擎',requestId:'req_01J2G1VP8A4',vendorTip:'请求处理成功'}];
const $=s=>document.querySelector(s);let rows=[...tasks],page=1,selected;const label=s=>({success:'成功',failed:'失败',interrupted:'已中断',running:'运行中'})[s];const cls=t=>t==='视频'?'video':t==='图片'?'image':'text';
function render(){const size=8,total=rows.length,list=rows.slice((page-1)*size,page*size);$('#body').innerHTML=list.map(t=>`<tr><td>${t.time}</td><td class="mono">${t.id}</td><td><span class="tag ${cls(t.type)}">${t.type}</span></td><td>${t.kind}</td><td>${t.user}</td><td>${t.workflow}<span class="work-sub">${t.wid}</span></td><td><span class="status"><i class="dot ${t.status}"></i>${label(t.status)}</span></td><td class="${t.output===0?'zero':''}">${t.output}</td><td>${t.duration}</td><td><button class="link" data-id="${t.id}">查看详情</button></td></tr>`).join('');$('#total').textContent=total;$('#runningNum').textContent=rows.filter(t=>t.status==='running').length;$('#abnormal').textContent=rows.filter(t=>t.status==='failed'||t.output===0).length;$('#outputs').textContent=rows.reduce((n,t)=>n+t.output,0);$('#result').textContent=`共 ${total} 条`;$('#range').textContent=`显示 ${total?(page-1)*size+1:0}-${Math.min(page*size,total)} 条，共 ${total} 条`;$('#previous').disabled=page===1;$('#next').disabled=page*size>=total;document.querySelectorAll('[data-id]').forEach(e=>e.onclick=()=>show(e.dataset.id))}
function search(){const start=$('#start').value,end=$('#end').value,user=$('#user').value.trim(),id=$('#taskId').value.trim(),wid=$('#workflowId').value.trim(),kind=$('#kind').value,type=$('#type').value,status=$('#status').value;rows=tasks.filter(t=>(!start||t.time.slice(0,10)>=start)&&(!end||t.time.slice(0,10)<=end)&&(!user||t.user.includes(user))&&(!id||t.id.includes(id))&&(!wid||t.wid.includes(wid))&&(!kind||t.kind===kind)&&(!type||t.type===type)&&(!status||t.status===status));page=1;render()}
function finish(t){if(t.duration==='进行中')return '未结束';const sec=t.duration.split(':').reduce((a,v)=>a*60+Number(v),0),d=new Date(new Date(t.time.replace(' ','T')).getTime()+sec*1000);return t.time.slice(0,11)+d.toTimeString().slice(0,8)}
function show(id){selected=tasks.find(t=>t.id===id);const abnormal=selected.status==='failed'||selected.output===0;const source=selected.kind==='工作流'?`<section class="section"><h4>工作流信息</h4><dl class="detail"><div class="row"><dt>工作流名称</dt><dd>${selected.workflow}</dd></div><div class="row"><dt>工作流 ID</dt><dd class="mono">${selected.wid}</dd></div></dl></section>`:`<section class="section"><h4>厂商请求信息</h4><dl class="detail"><div class="row"><dt>请求厂商</dt><dd>${selected.vendor}</dd></div><div class="row"><dt>厂商请求 ID</dt><dd class="mono">${selected.requestId}</dd></div><div class="row"><dt>厂商返回提示</dt><dd>${selected.vendorTip}</dd></div></dl></section>`;$('#detail').innerHTML=`${abnormal?`<div class="alert">${selected.status==='interrupted'?'该任务已中断，不计入输出成功率。':selected.status==='failed'?'该任务运行失败，请结合错误信息排查。':'该任务完成但未输出素材，请核对结果。'}</div>`:''}<section class="section"><h4>任务信息</h4><dl class="detail"><div class="row"><dt>任务开始时间</dt><dd>${selected.time}</dd></div><div class="row"><dt>任务结束时间</dt><dd>${finish(selected)}</dd></div><div class="row"><dt>任务 ID</dt><dd class="mono">${selected.id}</dd></div><div class="row"><dt>用户</dt><dd>${selected.user}</dd></div><div class="row"><dt>任务类型</dt><dd>${selected.kind}</dd></div><div class="row"><dt>生成类型</dt><dd>${selected.type}</dd></div><div class="row"><dt>任务状态</dt><dd>${label(selected.status)}</dd></div><div class="row"><dt>输出素材数量</dt><dd>${selected.output}</dd></div><div class="row"><dt>运行时长</dt><dd>${selected.duration}</dd></div>${selected.error?`<div class="row"><dt>错误信息</dt><dd class="zero">${selected.error}</dd></div>`:''}</dl></section>${source}<section class="section"><h4>运行记录</h4><div class="timeline"><div class="event"><b>${selected.time} 创建任务</b>任务已进入执行队列。</div><div class="event"><b>${selected.status==='success'?'任务执行完成':selected.status==='failed'?'任务执行失败':selected.status==='interrupted'?'任务已中断':'任务执行中'}</b>${selected.duration==='进行中'?'等待模型服务返回结果':`运行时长 ${selected.duration}`}</div></div></section>`;$('#drawer').classList.add('open');$('#mask').classList.add('open')}
function close(){$('#drawer').classList.remove('open');$('#mask').classList.remove('open')}function exportCsv(){const head=['任务开始时间','任务ID','生成类型','任务类型','用户','工作流名称','工作流ID','任务状态','输出素材数量','运行时长'];const csv=[head,...rows.map(t=>[t.time,t.id,t.type,t.kind,t.user,t.workflow,t.wid,label(t.status),t.output,t.duration])].map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='实时任务查询.csv';a.click();URL.revokeObjectURL(a.href)}
$('#search').onclick=search;$('#reset').onclick=()=>{['user','taskId','workflowId'].forEach(id=>$('#'+id).value='');['kind','type','status'].forEach(id=>$('#'+id).value='');$('#start').value='2026-08-24';$('#end').value='2026-08-29';search()};$('#previous').onclick=()=>{if(page>1){page--;render()}};$('#next').onclick=()=>{if(page*8<rows.length){page++;render()}};$('#export').onclick=exportCsv;$('#close').onclick=close;$('#mask').onclick=close;$('#copy').onclick=()=>{navigator.clipboard.writeText(JSON.stringify(selected,null,2));$('#copy').textContent='已复制';setTimeout(()=>$('#copy').textContent='复制任务信息',1200)};$('#retry').onclick=()=>alert(selected.kind==='工作流'?`已创建工作流回填任务（示例）\n原任务：${selected.id}\n私有工作流也可回填，不会因此在工作流页面恢复可见。`:`已创建通用生成回填任务（示例）\n原任务：${selected.id}\n将复用原任务参数，原任务不会被覆盖。`);render();
</script>
</body>
</html>
